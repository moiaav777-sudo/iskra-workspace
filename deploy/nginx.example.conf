# /etc/nginx/sites-available/workspace.example.ru на VPS (<адрес сервера>, общий примерно с 15 чужими
# проектами — <другой домен> один из них, не "имя" сервера). Ставится ops/vps_setup.sh.
# Сервисы живут на домашнем ПК; обратный SSH-туннель (пользователь tunnel) выводит их на 127.0.0.1 VPS:
#   8700 — портал, 8765 — Модератор, 8931 — Бриф, 8940 — Инфографика A3, 8950 — Повестка и участники.
# Перед каждым запросом к сервису nginx спрашивает портал (/auth/check/<сервис>) и передаёт сервису
# пользователя в X-Portal-* вместе с общим секретом (snippets/work-portal-secret.conf, только root).

limit_req_zone $binary_remote_addr zone=work_login:10m rate=10r/m;
# Приёмная документов с телефона: ключ длинный, но подбирать его никто не должен даже пробовать.
limit_req_zone $binary_remote_addr zone=work_inbox:10m rate=60r/m;

# Журнал для SRE-наблюдателя (решение пользователя 21.09): только время, код ответа, время ответа
# и сервис. Ни IP, ни адреса страницы, ни пользователя — в адресе приёмной лежит ключ, в журнал он
# не попадает. Сводку снимает portal/ops/observe.sh health.
map $request_uri $work_service {   # не $uri: после error_page он уже /_down.html (ревьюер, К1)
    ~^/moderator/   moderator;
    ~^/brief/       brief;
    ~^/a3/          a3;
    ~^/agenda/      agenda;
    ~^/theses/      theses;
    ~^/materials/   materials;
    ~^/_auth/       auth;
    default         portal;
}
# Группа маршрута без номеров, ключей и параметров: «moderator/api/meetings», «brief/api/run».
# Берутся только буквенные сегменты после /api/ — идентификаторы (цифры, hex) и адрес приёмной не попадают.
map $request_uri $work_route {
    ~^/(?<svc>moderator|brief|a3|agenda|theses|materials)/api/(?<ep>[a-z_-]+)   $svc/api/$ep;
    ~^/api/(?<pep>[a-z_-]+)                                                  portal/api/$pep;
    ~^/(?<svc2>moderator|brief|a3|agenda|theses|materials)/static/            $svc2/static;
    ~^/(?<svc3>moderator|brief|a3|agenda|theses|materials)/                   $svc3/page;
    default                                                                   other;
}
log_format work_sre '$time_iso8601 $status $request_time $work_service $work_route $request_method $upstream_status';

# Текст отказа по причине от портала. Нужен, чтобы человек понимал, почему его развернули.
map $deny_reason $deny_text {
    "admin-readonly"  "Под учётной записью администратора документы не создают и не правят — работайте под своей личной.";
    "read-only"       "Эта учётная запись открыта только для просмотра.";
    "change-password" "Сначала задайте свой пароль в портале.";
    default           "Нет доступа к этому сервису. Его открывает администратор.";
}

server {
    listen 80;
    listen [::]:80;
    server_name workspace.example.ru;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name workspace.example.ru;

    ssl_certificate /etc/letsencrypt/live/workspace.example.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/workspace.example.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;
    client_max_body_size 55m;
    access_log /var/log/nginx/work-sre.log work_sre;   # дополнительно к общему журналу
    access_log /var/log/nginx/access.log;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;

    include /etc/nginx/snippets/work-portal-secret.conf;   # set $portal_secret "...";

    error_page 502 503 504 /_down.html;
    location = /_down.html { root /var/www/work-portal; internal; }

    # служебное — наружу не отдаётся
    location /internal/ { return 404; }
    location /auth/ { return 404; }

    # проверка доступа (подзапросы auth_request)
    location = /_auth/moderator { internal; proxy_pass http://127.0.0.1:8700/auth/check/moderator; include /etc/nginx/snippets/work-portal-auth.conf; }
    location = /_auth/brief     { internal; proxy_pass http://127.0.0.1:8700/auth/check/brief;     include /etc/nginx/snippets/work-portal-auth.conf; }
    location = /_auth/a3        { internal; proxy_pass http://127.0.0.1:8700/auth/check/a3;        include /etc/nginx/snippets/work-portal-auth.conf; }
    location = /_auth/agenda    { internal; proxy_pass http://127.0.0.1:8700/auth/check/agenda;    include /etc/nginx/snippets/work-portal-auth.conf; }
    location = /_auth/theses    { internal; proxy_pass http://127.0.0.1:8700/auth/check/theses;    include /etc/nginx/snippets/work-portal-auth.conf; }
    location = /_auth/materials { internal; proxy_pass http://127.0.0.1:8700/auth/check/materials; include /etc/nginx/snippets/work-portal-auth.conf; }

    location @login          { return 302 /login?next=$request_uri; }
    location @denied_moderator {
        # Запрос из скрипта (fetch/XHR) должен получить отказ, а не страницу портала:
        # иначе сервис показывает «ошибка 200» и куски чужой разметки (находка чата A3, 19.09).
        if ($http_sec_fetch_mode != "navigate") {
            add_header Content-Type "application/json; charset=utf-8" always;
            return 403 '{"detail":"$deny_text"}';
        }
        return 302 /?denied=moderator;
    }
    location @denied_brief {
        # Запрос из скрипта (fetch/XHR) должен получить отказ, а не страницу портала:
        # иначе сервис показывает «ошибка 200» и куски чужой разметки (находка чата A3, 19.09).
        if ($http_sec_fetch_mode != "navigate") {
            add_header Content-Type "application/json; charset=utf-8" always;
            return 403 '{"detail":"$deny_text"}';
        }
        return 302 /?denied=brief;
    }
    location @denied_a3 {
        # Запрос из скрипта (fetch/XHR) должен получить отказ, а не страницу портала:
        # иначе сервис показывает «ошибка 200» и куски чужой разметки (находка чата A3, 19.09).
        if ($http_sec_fetch_mode != "navigate") {
            add_header Content-Type "application/json; charset=utf-8" always;
            return 403 '{"detail":"$deny_text"}';
        }
        return 302 /?denied=a3;
    }
    location @denied_agenda {
        # Запрос из скрипта (fetch/XHR) должен получить отказ, а не страницу портала:
        # иначе сервис показывает «ошибка 200» и куски чужой разметки (находка чата A3, 19.09).
        if ($http_sec_fetch_mode != "navigate") {
            add_header Content-Type "application/json; charset=utf-8" always;
            return 403 '{"detail":"$deny_text"}';
        }
        return 302 /?denied=agenda;
    }
    location @denied_theses {
        # Запрос из скрипта (fetch/XHR) должен получить отказ, а не страницу портала:
        # иначе сервис показывает «ошибка 200» и куски чужой разметки (находка чата A3, 19.09).
        if ($http_sec_fetch_mode != "navigate") {
            add_header Content-Type "application/json; charset=utf-8" always;
            return 403 '{"detail":"$deny_text"}';
        }
        return 302 /?denied=theses;
    }
    location @denied_materials {
        # Запрос из скрипта (fetch/XHR) должен получить отказ, а не страницу портала:
        # иначе сервис показывает «ошибка 200» и куски чужой разметки (находка чата A3, 19.09).
        if ($http_sec_fetch_mode != "navigate") {
            add_header Content-Type "application/json; charset=utf-8" always;
            return 403 '{"detail":"$deny_text"}';
        }
        return 302 /?denied=materials;
    }

    # вход: не больше 10 попыток в минуту с адреса (плюс лимиты в самом портале)
    location = /api/login {
        limit_req zone=work_login burst=5 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/work-portal-proxy.conf;
        proxy_pass http://127.0.0.1:8700;
    }

    location = /moderator { return 301 /moderator/; }
    location /moderator/ {
        auth_request /_auth/moderator;
        auth_request_set $portal_user $upstream_http_x_portal_user;
        auth_request_set $portal_role $upstream_http_x_portal_role;
        auth_request_set $portal_name $upstream_http_x_portal_name;
        auth_request_set $portal_team $upstream_http_x_portal_team;
        auth_request_set $deny_reason $upstream_http_x_deny_reason;
        error_page 401 = @login;
        error_page 403 = @denied_moderator;
        error_page 500 502 503 504 /_down.html;   # в location свои error_page — общие не наследуются
        include /etc/nginx/snippets/work-portal-proxy.conf;
        include /etc/nginx/snippets/work-portal-user.conf;
        proxy_pass http://127.0.0.1:8765/;
        proxy_read_timeout 900s;   # разбор документа в Искре идёт до ~13 минут
        proxy_send_timeout 900s;
    }

    location = /brief { return 301 /brief/; }
    location /brief/ {
        auth_request /_auth/brief;
        auth_request_set $portal_user $upstream_http_x_portal_user;
        auth_request_set $portal_role $upstream_http_x_portal_role;
        auth_request_set $portal_name $upstream_http_x_portal_name;
        auth_request_set $portal_team $upstream_http_x_portal_team;
        auth_request_set $deny_reason $upstream_http_x_deny_reason;
        error_page 401 = @login;
        error_page 403 = @denied_brief;
        error_page 500 502 503 504 /_down.html;   # в location свои error_page — общие не наследуются
        include /etc/nginx/snippets/work-portal-proxy.conf;
        include /etc/nginx/snippets/work-portal-user.conf;
        proxy_pass http://127.0.0.1:8931/;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    location = /a3 { return 301 /a3/; }
    location /a3/ {
        auth_request /_auth/a3;
        auth_request_set $portal_user $upstream_http_x_portal_user;
        auth_request_set $portal_role $upstream_http_x_portal_role;
        auth_request_set $portal_name $upstream_http_x_portal_name;
        auth_request_set $portal_team $upstream_http_x_portal_team;
        auth_request_set $deny_reason $upstream_http_x_deny_reason;
        error_page 401 = @login;
        error_page 403 = @denied_a3;
        error_page 500 502 503 504 /_down.html;
        include /etc/nginx/snippets/work-portal-proxy.conf;
        include /etc/nginx/snippets/work-portal-user.conf;
        proxy_pass http://127.0.0.1:8940/;
        proxy_read_timeout 900s;   # разбор справки в Искре идёт до ~13 минут
        proxy_send_timeout 900s;
    }

    location = /agenda { return 301 /agenda/; }
    location /agenda/ {
        auth_request /_auth/agenda;
        auth_request_set $portal_user $upstream_http_x_portal_user;
        auth_request_set $portal_role $upstream_http_x_portal_role;
        auth_request_set $portal_name $upstream_http_x_portal_name;
        auth_request_set $portal_team $upstream_http_x_portal_team;
        auth_request_set $deny_reason $upstream_http_x_deny_reason;
        error_page 401 = @login;
        error_page 403 = @denied_agenda;
        error_page 500 502 503 504 /_down.html;
        include /etc/nginx/snippets/work-portal-proxy.conf;
        include /etc/nginx/snippets/work-portal-user.conf;
        proxy_pass http://127.0.0.1:8950/;
        proxy_read_timeout 900s;   # разбор документа в Искре идёт до ~13 минут
        proxy_send_timeout 900s;
    }

    location /theses/ {
        auth_request /_auth/theses;
        auth_request_set $portal_user $upstream_http_x_portal_user;
        auth_request_set $portal_role $upstream_http_x_portal_role;
        auth_request_set $portal_name $upstream_http_x_portal_name;
        auth_request_set $portal_team $upstream_http_x_portal_team;
        auth_request_set $deny_reason $upstream_http_x_deny_reason;
        error_page 401 = @login;
        error_page 403 = @denied_theses;
        error_page 500 502 503 504 /_down.html;
        include /etc/nginx/snippets/work-portal-proxy.conf;
        include /etc/nginx/snippets/work-portal-user.conf;
        proxy_pass http://127.0.0.1:8960/;
        proxy_read_timeout 900s;   # тезисы пишутся Искрой, это долго
        proxy_send_timeout 900s;
    }

    # Документы с телефона: быстрая команда приходит без входа в портал, с ключом приёмной
    # в заголовке. Поэтому здесь нет auth_request — ключ проверяет сам сервис, спрашивая портал.
    location ^~ /materials/api/inbox {
        limit_req zone=work_inbox burst=10 nodelay;
        limit_req_status 429;
        error_page 500 502 503 504 /_down.html;
        include /etc/nginx/snippets/work-portal-proxy.conf;
        proxy_pass http://127.0.0.1:8970/api/inbox;
        client_max_body_size 300m;
        proxy_request_buffering off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    location /materials/ {
        auth_request /_auth/materials;
        auth_request_set $portal_user $upstream_http_x_portal_user;
        auth_request_set $portal_role $upstream_http_x_portal_role;
        auth_request_set $portal_name $upstream_http_x_portal_name;
        auth_request_set $portal_team $upstream_http_x_portal_team;
        auth_request_set $deny_reason $upstream_http_x_deny_reason;
        error_page 401 = @login;
        error_page 403 = @denied_materials;
        error_page 500 502 503 504 /_down.html;
        include /etc/nginx/snippets/work-portal-proxy.conf;
        include /etc/nginx/snippets/work-portal-user.conf;
        proxy_pass http://127.0.0.1:8970/;
        client_max_body_size 300m;  # презентации к совещанию бывают тяжёлыми
        proxy_request_buffering off;  # большой файл не держим целиком в памяти VPS
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    # портал: вход, стартовая страница, администрирование
    location / {
        include /etc/nginx/snippets/work-portal-proxy.conf;
        proxy_pass http://127.0.0.1:8700;
        proxy_read_timeout 900s;
    }
}
