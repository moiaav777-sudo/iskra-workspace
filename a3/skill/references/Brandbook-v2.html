                <div class=\"type-meta-item\"><span class=\"type-meta-label\">Начертание:<\u002Fspan> Regular (400)<\u002Fdiv>\n                            <div class=\"type-meta-item\"><span class=\"type-meta-label\">Цвет:<\u002Fspan> #414b5f<\u002Fdiv>\n                        <\u002Fdiv>\n                    <\u002Fdiv>\n                <\u002Fdiv>\n\n                <div class=\"rules-box\" style=\"margin-bottom: 40px;\">\n                    <h3>Как пересчитать кегль<\u002Fh3>\n                    <ul>\n                        <li>M = высота рабочей области ÷ 18. Кегль = значение из таблицы × M, в тех единицах, в которых задана высота<\u002Fli>\n                        <li>Пример: при высоте 1080 px M = 60 px, основной текст 0,55–0,6 M = 33–36 px; при высоте 3 м M ≈ 16,7 см<\u002Fli>\n                        <li>Для крупных форматов дополнительно проверьте читаемость по дистанции: высота заглавных букв — не менее 3 мм на каждый метр до самого дальнего зрителя. Если правило даёт больший размер, используйте его<\u002Fli>\n                    <\u002Ful>\n                <\u002Fdiv>\n\n                <div class=\"font-recommendations\">\n                    <h3>Корпоративный шрифт<\u002Fh3>\n                    <p style=\"margin-bottom: 8px;\"><strong>Основной:<\u002Fstrong> Golos Text — рубленый шрифт с полной кириллицей, начертания Regular, Medium, Semibold, Bold. Распространяется бесплатно по лицензии SIL Open Font License, допускает коммерческое использование. Шрифт должен быть установлен на всех станциях вывода либо внедрён в файл презентации.<\u002Fp>\n                    <p><strong>Замена:<\u002Fstrong> Arial — только если Golos Text недоступен на компьютере демонстрации. Другие шрифты не используются.<\u002Fp>\n                <\u002Fdiv>\n            <\u002Fdiv>\n        <\u002Fsection>\n\n        <!-- 04 · Композиция -->\n        <section class=\"section\" id=\"composition\" aria-label=\"Композиция\">\n            <div class=\"container\">\n                <div class=\"section-header\">\n                    <div class=\"section-number\">04 · Композиция<\u002Fdiv>\n                    <h2 class=\"section-title\">Макет и сетка<\u002Fh2>\n                    <p class=\"section-description\">\n                        Формат и размер слайда задаёт система компоновки: от 16:9 до многопанельных триптихов. Брендбук задаёт не размеры, а пропорции — все величины выражены через модуль M и масштабируются под любой формат.\n                    <\u002Fp>\n                <\u002Fdiv>\n\n                <div class=\"format-demo\" style=\"flex-wrap: wrap; align-items: flex-end; gap: 32px;\">\n                    <div style=\"display: flex; flex-direction: column; align-items: center; gap: 10px;\"><div style=\"width: 160px; height: 90px; border: 2px solid var(--color-secondary); border-radius: 4px; background: repeating-linear-gradient(45deg, transparent, transparent 8px, rgba(20,70,150,0.05) 8px, rgba(20,70,150,0.05) 16px); display: flex;\"><\u002Fdiv><span style=\"font-size: 13px; color: var(--color-text-secondary); font-weight: 500;\">16 : 9<\u002Fspan><\u002Fdiv>\n                    <div style=\"display: flex; flex-direction: column; align-items: center; gap: 10px;\"><div style=\"width: 240px; height: 68px; border: 2px solid var(--color-secondary); border-radius: 4px; background: repeating-linear-gradient(45deg, transparent, transparent 8px, rgba(20,70,150,0.05) 8px, rgba(20,70,150,0.05) 16px); display: flex;\"><\u002Fdiv><span style=\"font-size: 13px; color: var(--color-text-secondary); font-weight: 500;\">32 : 9<\u002Fspan><\u002Fdiv>\n                    <div style=\"display: flex; flex-direction: column; align-items: center; gap: 10px;\"><div style=\"width: 390px; height: 71px; border: 2px solid var(--color-secondary); border-radius: 4px; background: repeating-linear-gradient(45deg, transparent, transparent 8px, rgba(20,70,150,0.05) 8px, rgba(20,70,150,0.05) 16px); display: flex;\"><div style=\"flex: 1; border-right: 1px dashed var(--color-secondary);\"><\u002Fdiv><div style=\"flex: 1; border-right: 1px dashed var(--color-secondary);\"><\u002Fdiv><div style=\"flex: 1;\"><\u002Fdiv><\u002Fdiv><span style=\"font-size: 13px; color: var(--color-text-secondary); font-weight: 500;\">Триптих 55 : 10<\u002Fspan><\u002Fdiv>\n                <\u002Fdiv>\n\n                <div class=\"comp-grid\">\n                    <div class=\"comp-card\">\n                        <h3>Модуль M<\u002Fh3>\n                        <p style=\"font-size: 14px; color: var(--color-text-secondary); margin-bottom: 12px;\">Единая единица для всех размеров.<\u002Fp>\n                        <ul>\n                            <li>M = высота рабочей области ÷ 18<\u002Fli>\n                            <li>Считается от высоты, поэтому одинаково работает на любой ширине<\u002Fli>\n                            <li>Для триптиха — от общей высоты полотна<\u002Fli>\n                        <\u002Ful>\n                    <\u002Fdiv>\n                    <div class=\"comp-card\">\n                        <h3>Поля<\u002Fh3>\n                        <p style=\"font-size: 14px; color: var(--color-text-secondary); margin-bottom: 12px;\">Щедрые отступы обеспечивают визуальное дыхание и читаемость.<\u002Fp>\n                        <ul>\n                            <li>Верхнее и нижнее: 1 M<\u002Fli>\n                            <li>Левое и правое: 1⅓ M<\u002Fli>\n                            <li>Колонтитул размещается внутри нижнего поля<\u002Fli>\n                        <\u002Ful>\n                    <\u002Fdiv>\n                    <div class=\"comp-card\">\n                        <h3>Сетка<\u002Fh3>\n                        <p style=\"font-size: 14px; color: var(--color-text-secondary); margin-bottom: 12px;\">Число колонок зависит от ширины формата.<\u002Fp>\n                        <ul>\n                            <li>Колонка: 2 M, промежуток: 0,5 M<\u002Fli>\n                            <li>Колонок — сколько помещается между полями<\u002Fli>\n                            <li>Пример: 16:9 — 12 колонок, 32:9 — 26 колонок<\u002Fli>\n                        <\u002Ful>\n                    <\u002Fdiv>\n                    <div class=\"comp-card\">\n                        <h3>Многопанельные форматы<\u002Fh3>\n                        <p style=\"font-size: 14px; color: var(--color-text-secondary); margin-bottom: 12px;\">Триптихи и составные экраны.<\u002Fp>\n                        <ul>\n                            <li>Каждая панель — самостоятельное поле с полями 1 M у стыков, либо единое полотно<\u002Fli>\n                            <li>Текст, цифры и лица не размещаются на стыках панелей<\u002Fli>\n                            <li>Заголовок — один на полотно или на панель, не дублируется<\u002Fli>\n                        <\u002Ful>\n                    <\u002Fdiv>\n                    <div class=\"comp-card\">\n                        <h3>Выравнивание<\u002Fh3>\n                        <p style=\"font-size: 14px; color: var(--color-text-secondary); margin-bottom: 12px;\">Последовательное выравнивание создаёт порядок.<\u002Fp>\n                        <ul>\n                            <li>Заголовки и текст: по левому краю<\u002Fli>\n                            <li>Отдельные крупные цифры (KPI): по центру<\u002Fli>\n                            <li>Цифры в таблицах: по правому краю<\u002Fli>\n                            <li>Номер слайда: правый нижний угол<\u002Fli>\n                        <\u002Ful>\n                    <\u002Fdiv>\n                    <div class=\"comp-card\">\n                        <h3>Нумерация секций<\u002Fh3>\n                        <p style=\"font-size: 14px; color: var(--color-text-secondary); margin-bottom: 12px;\">Крупные цифры для навигации по разделам.<\u002Fp>\n                        <ul>\n                            <li>Формат: 01, 02, 03…<\u002Fli>\n                            <li>Контентный слайд: 1,3–1,6 M, #99c2ff, правый верхний угол<\u002Fli>\n                            <li>Разделитель секций: 3,2–4 M, #99c2ff, по центру<\u002Fli>\n                        <\u002Ful>\n                    <\u002Fdiv>\n                    <div class=\"comp-card\">\n                        <h3>Колонтитул<\u002Fh3>\n                        <p style=\"font-size: 14px; color: var(--color-text-secondary); margin-bottom: 12px;\">Повторяется на всех слайдах, кроме титульного и разделителей.<\u002Fp>\n                        <ul>\n                            <li>Номер слайда: 0,4 M, #414b5f, справа внизу<\u002Fli>\n                            <li>Источник данных: 0,4 M, #414b5f, слева внизу<\u002Fli>\n                            <li>Положение одинаково на всех слайдах<\u002Fli>\n                        <\u002Ful>\n                    <\u002Fdiv>\n                <\u002Fdiv>\n            <\u002Fdiv>\n        <\u002Fsection>\n\n        <!-- 05 · Графические элементы -->\n        <section class=\"section\" id=\"graphics\" aria-label=\"Графические элементы\">\n            <div class=\"container\">\n                <div class=\"section-header\">\n                    <div class=\"section-number\">05 · Графические элементы<\u002Fdiv>\n                    <h2 class=\"section-title\">Визуальные компоненты<\u002Fh2>\n                    <p class=\"section-description\">\n                        Минималистичный подход с акцентом на содержание. Декоративные элементы поддерживают, но не доминируют.\n                    <\u002Fp>\n                <\u002Fdiv>\n\n                <div class=\"graphics-grid\">\n                    <div class=\"graphic-card\">\n                        <div class=\"graphic-icon\">\n                            <svg viewBox=\"0 0 48 48\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\">\n                                <circle cx=\"24\" cy=\"24\" r=\"20\" stroke=\"#144696\" stroke-width=\"2\" fill=\"rgba(153,194,255,0.2)\"><\u002Fcircle>\n                            <\u002Fsvg>\n                        <\u002Fdiv>\n                        <h3>Геометрические формы<\u002Fh3>\n                        <p>Круги и плавные кривые #99c2ff на фоне титульных и разделительных слайдов. Не более одной формы на слайд, текст поверх формы не размещается.<\u002Fp>\n                    <\u002Fdiv>\n                    <div class=\"graphic-card\">\n                        <div class=\"graphic-icon\">\n                            <svg viewBox=\"0 0 48 48\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\">\n                                <defs><linearGradient id=\"gg1\" x1=\"0\" y1=\"0\" x2=\"48\" y2=\"48\"><stop offset=\"0%\" stop-color=\"#062a5f\"><\u002Fstop><stop offset=\"100%\" stop-color=\"#99c2ff\"><\u002Fstop><\u002FlinearGradient><\u002Fdefs>\n                                <rect x=\"4\" y=\"4\" width=\"40\" height=\"40\" rx=\"8\" fill=\"url(#gg1)\"><\u002Frect>\n                            <\u002Fsvg>\n                        <\u002Fdiv>\n                        <h3>Градиенты<\u002Fh3>\n                        <p>Только переход #062a5f → #144696 и только на фоне титульного слайда. В графиках, карточках и таблицах градиенты не используются.<\u002Fp>\n                    <\u002Fdiv>\n                    <div class=\"graphic-card\">\n                        <div class=\"graphic-icon\">\n                            <svg viewBox=\"0 0 48 48\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\">\n                                <circle cx=\"24\" cy=\"20\" r=\"8\" stroke=\"#144696\" stroke-width=\"2\"><\u002Fcircle>\n                                <path d=\"M24 28 L24 40\" stroke=\"#144696\" stroke-width=\"2\"><\u002Fpath>\n                                <path d=\"M16 34 L32 34\" stroke=\"#144696\" stroke-width=\"2\"><\u002Fpath>\n                            <\u002Fsvg>\n                        <\u002Fdiv>\n                        <h3>Иконки<\u002Fh3>\n                        <p>Один набор линейных иконок на всю презентацию (например, открытый набор Lucide). Толщина линии — 1/24 размера иконки, скруглённые концы, цвет #144696. Размер: 0,4–0,8 M.<\u002Fp>\n                    <\u002Fdiv>\n                    <div class=\"graphic-card\">\n                        <div class=\"graphic-icon\">\n                            <svg viewBox=\"0 0 48 48\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\">\n                                <rect x=\"4\" y=\"8\" width=\"18\" height=\"14\" rx=\"3\" stroke=\"#144696\" stroke-width=\"2\" fill=\"rgba(153,194,255,0.15)\"><\u002Frect>\n                                <rect x=\"26\" y=\"8\" width=\"18\" height=\"14\" rx=\"3\" stroke=\"#144696\" stroke-width=\"2\" fill=\"rgba(153,194,255,0.15)\"><\u002Frect>\n                                <rect x=\"4\" y=\"26\" width=\"18\" height=\"14\" rx=\"3\" stroke=\"#144696\" stroke-width=\"2\" fill=\"rgba(153,194,255,0.15)\"><\u002Frect>\n                                <rect x=\"26\" y=\"26\" width=\"18\" height=\"14\" rx=\"3\" stroke=\"#144696\" stroke-width=\"2\" fill=\"rgba(153,194,255,0.15)\"><\u002Frect>\n                            <\u002Fsvg>\n                        <\u002Fdiv>\n                        <h3>Карточки<\u002Fh3>\n                        <p>Прямоугольные блоки с закруглёнными углами (0,15–0,2 M). Для группировки связанной информации. Лёгкая тень или граница.<\u002Fp>\n                    <\u002Fdiv>\n                    <div class=\"graphic-card\">\n                        <div class=\"graphic-icon\">\n                            <svg viewBox=\"0 0 48 48\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\">\n                                <rect x=\"6\" y=\"28\" width=\"8\" height=\"14\" rx=\"2\" fill=\"#062a5f\"><\u002Frect>\n                                <rect x=\"18\" y=\"20\" width=\"8\" height=\"22\" rx=\"2\" fill=\"#144696\"><\u002Frect>\n                                <rect x=\"30\" y=\"12\" width=\"8\" height=\"30\" rx=\"2\" fill=\"#99c2ff\"><\u002Frect>\n                            <\u002Fsvg>\n                        <\u002Fdiv>\n                        <h3>Диаграммы<\u002Fh3>\n                        <p>Визуализация данных в синей палитре, сплошные заливки без украшений. Смысловые цвета — только для роста, снижения и внимания.<\u002Fp>\n                    <\u002Fdiv>\n                    <div class=\"graphic-card\">\n                        <div class=\"graphic-icon\">\n                            <svg viewBox=\"0 0 48 48\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\">\n                                <line x1=\"4\" y1=\"24\" x2=\"44\" y2=\"24\" stroke=\"#144696\" stroke-width=\"2\"><\u002Fline>\n                                <circle cx=\"14\" cy=\"24\" r=\"3\" fill=\"#144696\"><\u002Fcircle>\n                                <circle cx=\"34\" cy=\"24\" r=\"3\" fill=\"#144696\"><\u002Fcircle>\n                            <\u002Fsvg>\n                        <\u002Fdiv>\n                        <h3>Линии и разделители<\u002Fh3>\n                        <p>Тонкие горизонтальные линии (0,02–0,03 M) для разделения секций. Цвет: #e5e5e5 или #144696.<\u002Fp>\n                    <\u002Fdiv>\n                <\u002Fdiv>\n            <\u002Fdiv>\n        <\u002Fsection>\n\n        <!-- 06 · Графики и диаграммы -->\n        <section class=\"section\" id=\"charts\" aria-label=\"Графики и диаграммы\">\n            <div class=\"container\">\n                <div class=\"section-header\">\n                    <div class=\"section-number\">06 · Графики и таблицы<\u002Fdiv>\n                    <h2 class=\"section-title\">Визуализация данных<\u002Fh2>\n                    <p class=\"section-description\">\n                        Графики, диаграммы и таблицы следуют единой цветовой палитре и стилю. Используются для наглядного представления статистики, трендов и сравнений.\n                    <\u002Fp>\n                <\u002Fdiv>\n\n                <div class=\"charts-grid\">\n                    <!-- Bar Chart -->\n                    <div class=\"chart-card\">\n                        <div class=\"chart-card-header\">\n                            <h3>Столбчатая диаграмма<\u002Fh3>\n                            <p>Сравнение показателей по категориям. Текущий период выделен тёмно-синим<\u002Fp>\n                        <\u002Fdiv>\n                        <div class=\"chart-card-body\">\n                            <div class=\"chart-unit\">Количество проектов, ед.<\u002Fdiv>\n                            <div class=\"bar-chart\">\n                                <div class=\"bar-group\">\n                                    <div class=\"bar\" style=\"height: 55%; background: #144696;\">\n                                        <span class=\"bar-value\">21<\u002Fspan>\n                                    <\u002Fdiv>\n                                    <span class=\"bar-label\">2024<\u002Fspan>\n                                <\u002Fdiv>\n                                <div class=\"bar-group\">\n                                    <div class=\"bar\" style=\"height: 78%; background: #144696;\">\n                                        <span class=\"bar-value\">30<\u002Fspan>\n                                    <\u002Fdiv>\n                                    <span class=\"bar-label\">2025<\u002Fspan>\n                                <\u002Fdiv>\n                                <div class=\"bar-group\">\n                                    <div class=\"bar\" style=\"height: 100%; background: #062a5f;\">\n                                        <span class=\"bar-value\">38<\u002Fspan>\n                                    <\u002Fdiv>\n                                    <span class=\"bar-label\">2026<\u002Fspan>\n                                <\u002Fdiv>\n                            <\u002Fdiv>\n                        <\u002Fdiv>\n                    <\u002Fdiv>\n\n                    <!-- Donut Chart -->\n                    <div class=\"chart-card\">\n                        <div class=\"chart-card-header\">\n                            <h3>Кольцевая диаграмма<\u002Fh3>\n                            <p>Доли направлений в общем бюджете<\u002Fp>\n                        <\u002Fdiv>\n                        <div class=\"chart-card-body\">\n                            <div class=\"donut-container\">\n                                <svg class=\"donut-svg\" viewBox=\"0 0 42 42\">\n                                    <circle cx=\"21\" cy=\"21\" r=\"15.9\" fill=\"transparent\" stroke=\"#062a5f\" stroke-width=\"5\" stroke-dasharray=\"40 60\" stroke-dashoffset=\"25\"><\u002Fcircle>\n                                    <circle cx=\"21\" cy=\"21\" r=\"15.9\" fill=\"transparent\" stroke=\"#144696\" stroke-width=\"5\" stroke-dasharray=\"25 75\" stroke-dashoffset=\"85\"><\u002Fcircle>\n                                    <circle cx=\"21\" cy=\"21\" r=\"15.9\" fill=\"transparent\" stroke=\"#99c2ff\" stroke-width=\"5\" stroke-dasharray=\"20 80\" stroke-dashoffset=\"60\"><\u002Fcircle>\n                                    <circle cx=\"21\" cy=\"21\" r=\"15.9\" fill=\"transparent\" stroke=\"#c9ced6\" stroke-width=\"5\" stroke-dasharray=\"15 85\" stroke-dashoffset=\"40\"><\u002Fcircle>\n                                    <text x=\"21\" y=\"21.5\" text-anchor=\"middle\" font-size=\"6\" font-weight=\"700\" fill=\"#062a5f\">2,4<\u002Ftext><text x=\"21\" y=\"26\" text-anchor=\"middle\" font-size=\"3\" fill=\"#414b5f\">млрд ₽<\u002Ftext>\n                                <\u002Fsvg>\n                                <div class=\"donut-legend\">\n                                    <div class=\"legend-item\"><div class=\"legend-dot\" style=\"background:#062a5f;\"><\u002Fdiv>Проекты 40%<\u002Fdiv>\n                                    <div class=\"legend-item\"><div class=\"legend-dot\" style=\"background:#144696;\"><\u002Fdiv>Аналитика 25%<\u002Fdiv>\n                                    <div class=\"legend-item\"><div class=\"legend-dot\" style=\"background:#99c2ff;\"><\u002Fdiv>Развитие 20%<\u002Fdiv>\n                                    <div class=\"legend-item\"><div class=\"legend-dot\" style=\"background:#c9ced6;\"><\u002Fdiv>Прочее 15%<\u002Fdiv>\n                                <\u002Fdiv>\n                            <\u002Fdiv>\n                        <\u002Fdiv>\n                    <\u002Fdiv>\n\n                    <!-- Line Chart -->\n                    <div class=\"chart-card\">\n                        <div class=\"chart-card-header\">\n                            <h3>Линейный график<\u002Fh3>\n                            <p>Динамика показателей во времени<\u002Fp>\n                        <\u002Fdiv>\n                        <div class=\"chart-card-body\">\n                            <div class=\"chart-unit\">Объём финансирования, млрд ₽<\u002Fdiv>\n                            <div class=\"line-chart-container\">\n                                <span class=\"y-label\" style=\"top: 20%;\">40<\u002Fspan><span class=\"y-label\" style=\"top: 40%;\">30<\u002Fspan><span class=\"y-label\" style=\"top: 60%;\">20<\u002Fspan><span class=\"y-label\" style=\"top: 80%;\">10<\u002Fspan>\n                                <svg class=\"line-chart-svg\" viewBox=\"0 0 400 200\" preserveAspectRatio=\"none\">\n                                    <defs>\n                                        <linearGradient id=\"areaGrad\" x1=\"0%\" y1=\"0%\" x2=\"0%\" y2=\"100%\">\n                                            <stop offset=\"0%\" style=\"stop-color:#144696;stop-opacity:0.3\"><\u002Fstop>\n                                            <stop offset=\"100%\" style=\"stop-color:#99c2ff;stop-opacity:0\"><\u002Fstop>\n                                        <\u002FlinearGradient>\n                                    <\u002Fdefs>\n                                    <line x1=\"0\" y1=\"40\" x2=\"400\" y2=\"40\" stroke=\"#e5e5e5\" stroke-width=\"1\"><\u002Fline>\n                                    <line x1=\"0\" y1=\"80\" x2=\"400\" y2=\"80\" stroke=\"#e5e5e5\" stroke-width=\"1\"><\u002Fline>\n                                    <line x1=\"0\" y1=\"120\" x2=\"400\" y2=\"120\" stroke=\"#e5e5e5\" stroke-width=\"1\"><\u002Fline>\n                                    <line x1=\"0\" y1=\"160\" x2=\"400\" y2=\"160\" stroke=\"#e5e5e5\" stroke-width=\"1\"><\u002Fline>\n                                    <path d=\"M 0,140 L 80,120 L 160,100 L 240,80 L 320,50 L 400,30 L 400,200 L 0,200 Z\" fill=\"url(#areaGrad)\"><\u002Fpath>\n                                    <path d=\"M 0,140 L 80,120 L 160,100 L 240,80 L 320,50 L 400,30\" stroke=\"#144696\" stroke-width=\"3\" fill=\"none\" stroke-linecap=\"round\"><\u002Fpath>\n                                    <circle cx=\"0\" cy=\"140\" r=\"5\" fill=\"#062a5f\"><\u002Fcircle>\n                                    <circle cx=\"80\" cy=\"120\" r=\"5\" fill=\"#062a5f\"><\u002Fcircle>\n                                    <circle cx=\"160\" cy=\"100\" r=\"5\" fill=\"#062a5f\"><\u002Fcircle>\n                                    <circle cx=\"240\" cy=\"80\" r=\"5\" fill=\"#062a5f\"><\u002Fcircle>\n                                    <circle cx=\"320\" cy=\"50\" r=\"5\" fill=\"#062a5f\"><\u002Fcircle>\n                                    <circle cx=\"400\" cy=\"30\" r=\"5\" fill=\"#55a555\"><\u002Fcircle>\n                                <\u002Fsvg>\n                            <\u002Fdiv>\n                            <div class=\"x-labels\"><span>2021<\u002Fspan><span>2022<\u002Fspan><span>2023<\u002Fspan><span>2024<\u002Fspan><span>2025<\u002Fspan><span>2026<\u002Fspan><\u002Fdiv>\n                            <div class=\"chart-source\">Источник: данные Центра, 2026<\u002Fdiv>\n                        <\u002Fdiv>\n                    <\u002Fdiv>\n\n                    <!-- Horizontal Bar -->\n                    <div class=\"chart-card\">\n                        <div class=\"chart-card-header\">\n                            <h3>Горизонтальная диаграмма<\u002Fh3>\n                            <p>Рейтинг или распределение по категориям, доля выполнения, %<\u002Fp>\n                    <ul>\n                        <li>Шапка: фон #062a5f, белый текст, Semibold, 0,45–0,55 M<\u002Fli>\n                        <li>Строки: Regular 0,45–0,55 M, #232832; чередование фона #ffffff / #f8f9fa, границы 0,02 M #e5e5e5<\u002Fli>\n                        <li>Итоговая строка: Bold, фон #e8eef8, верхняя граница 0,03 M #144696<\u002Fli>\n                        <li>Текст — по левому краю, цифры — по правому, с пробелом между разрядами (2 400) и десятичной запятой (5,5 %)<\u002Fli>\n                        <li>Единицы измерения — в шапке или в названии строки, а не в каждой ячейке<\u002Fli>\n                        <li>На 16:9 — не более 6–7 строк и 5–6 столбцов; на широких форматах таблица не шире 26 M; источник под таблицей, 0,4 M, #414b5f<\u002Fli>\n                        <li>Вертикальные линии, заливка отдельных ячеек и объёмные эффекты не используются<\u002Fli>\n                    <\u002Ful>\n                <\u002Fdiv>\n\n                <!-- Chart Rules -->\n                <div class=\"chart-rules\">\n                    <div class=\"chart-rule\">\n                        <h4><span class=\"rule-do\">✓<\u002Fspan> Цветовая последовательность<\u002Fh4>\n                        <p>Категории окрашиваются в порядке: #062a5f → #144696 → #99c2ff → #98a8f8, «прочее» — #c9ced6. Зелёный, красный и оранжевый — только для роста, снижения и внимания.<\u002Fp>\n                    <\u002Fdiv>\n                    <div class=\"chart-rule\">\n                        <h4><span class=\"rule-do\">✓<\u002Fspan> Читаемость данных<\u002Fh4>\n                        <p>Значения должны быть видны: размещайте цифры над столбцами, внутри сегментов или рядом с точками. Размер шрифта: 0,4–0,45 M.<\u002Fp>\n                    <\u002Fdiv>\n                    <div class=\"chart-rule\">\n                        <h4><span class=\"rule-do\">✓<\u002Fspan> Простота и ясность<\u002Fh4>\n                        <p>Не более 5–7 категорий на одном графике. Используйте леген iv>\n                            <div class=\"mockup-divider\"><\u002Fdiv>\n                            <div class=\"mockup-kpi\">\n                                <div class=\"mockup-kpi-value\">2,5 млн<\u002Fdiv>\n                                <div class=\"mockup-kpi-label\">Участников<\u002Fdiv>\n                                <div class=\"mockup-kpi-trend\">+28%<\u002Fdiv>\n                            <\u002Fdiv>\n                            <div class=\"mockup-divider\"><\u002Fdiv>\n                            <div class=\"mockup-kpi\">\n                                <div class=\"mockup-kpi-value\">1 240<\u002Fdiv>\n                                <div class=\"mockup-kpi-label\">Заявок<\u002Fdiv>\n                                <div class=\"mockup-kpi-trend down\">−8 %<\u002Fdiv>\n                            <\u002Fdiv>\n                            <div class=\"mockup-source\">Источник: данные Центра, 2026<\u002Fdiv>\n                            <div class=\"mockup-page-num\">8<\u002Fdiv>\n                        <\u002Fdiv>\n                        <div style=\"padding: 16px 20px; font-size: 13px; color: var(--color-text-secondary); line-height: 1.6;\">\n                            <strong style=\"color: var(--color-primary);\">Элементы:<\u002Fstrong> крупные цифры 2–2,7 M #062a5f, подписи 0,45–0,55 M #414b5f, тренды текстом: #2e7d32 для роста, #c62828 для снижения. Источник и номер слайда 0,4 M внизу.\n                        <\u002Fdiv>\n                    <\u002Fdiv>\n\n                    <!-- Section Divider -->\n                    <div class=\"mockup-card\">\n                        <div class=\"mockup-label\">Разделитель секций<\u002Fdiv>\n                        <div class=\"mockup-slide mockup-divider-slide\">\n                            <div class=\"big-num\">03<\u002Fdiv>\n                            <div class=\"section-name\">Результаты и достижения<\u002Fdiv>\n                        <\u002Fdiv>\n                        <div style=\"padding: 16px 20px; font-size: 13px; color: var(--color-text-secondary); line-height: 1.6;\">\n                            <strong style=\"color: var(--color-primary);\">Элементы:<\u002Fstrong> фон #062a5f, номер секции 3,2–4 M #99c2ff, название раздела 1,2–1,4 M белый, минималистичный дизайн, много воздуха. Колонтитул не ставится.\n                        <\u002Fdiv>\n                    <\u002Fdiv>\n                <\u002Fdiv>\n            <\u002Fdiv>\n        <\u002Fsection>\n\n        <!-- 08 · Do & Don't -->\n        <section class=\"section\" id=\"dodont\" aria-label=\"Можно и нельзя\">\n            <div class=\"container\">\n                <div class=\"section-header\">\n                    <div class=\"section-number\">08 · Можно и нельзя<\u002Fdiv>\n                    <h2 class=\"section-title\">Правила для слайдов<\u002Fh2>\n                    <p class=\"section-description\">\n                        Ключевые рекомендации по оформлению слайдов: что делать и чего избегать.\n                    <\u002Fp>\n                <\u002Fdiv>\n\n                <div class=\"dodont-grid\">\n                    <div class=\"dodont-col do-col\">\n                        <h3>✓ Делайте<\u002Fh3>\n                        <div class=\"dodont-item\">Используйте единую цветовую палитру на всех слайдах презентации<\u002Fdiv>\n                        <div class=\"dodont-item\">Оставляйте достаточно свободного пространства — воздух улучшает восприятие<\u002Fdiv>\n                        <div class=\"dodont-item\">Выравнивайте элементы по сетке: это создаёт визуальный порядок<\u002Fdiv>\n                        <div class=\"dodont-item\">Используйте одну гарнитуру — Golos Text — с разными начертаниями для иерархии<\u002Fdiv>\n                        <div class=\"dodont-item\">Подписывайте графики и диаграммы: единицы измерения, источники данных<\u002Fdiv>\n                        <div class=\"dodont-item\">Собирайте слайды на мастер-слайдах шаблона, а не оформляйте вручную<\u002Fdiv>\n                        <div class=\"dodont-item\">Используйте контраст для выделения ключевой информации<\u002Fdiv>\n                        <div class=\"dodont-item\">Нумеруйте слайды для удобства навигации во время обсуждения<\u002Fdiv>\n                    <\u002Fdiv>\n                    <div class=\"dodont-col dont-col\">\n                        <h3>✗ Не делайте<\u002Fh3>\n                        <div class=\"dodont-item\">Не используйте другие шрифты, кроме Golos Text (Arial — только как замена)<\u002Fdiv>\n                        <div class=\"dodont-item\">Не размещайте текст поверх пёстрых изображений без затемняющего оверлея<\u002Fdiv>\n                        <div class=\"dodont-item\">Не выделяйте текст подчёркиванием и курсивом — используйте полужирное начертание или цвет<\u002Fdiv>\n                        <div class=\"dodont-item\">Не используйте цвета вне утверждённой палитры без согласования<\u002Fdiv>\n                        <div class=\"dodont-item\">Не заполняйте слайд текстом целиком — один слайд = одна ключевая мысль<\u002Fdiv>\n                        <div class=\"dodont-item\">Не меняйте положение заголовка и номера слайда от слайда к слайду<\u002Fdiv>\n                        <div class=\"dodont-item\">Не используйте 3D-эффекты, объёмные диаграммы и градиенты в графиках — они искажают данные<\u002Fdiv>\n                        <div class=\"dodont-item\">Не ставьте шрифт меньше 0,4 M и меньше минимума по дистанции просмотра<\u002Fdiv>\n                    <\u002Fdiv>\n                <\u002Fdiv>\n            <\u002Fdiv>\n        <\u002Fsection>\n\n        <!-- 09 · Анимации и переходы -->\n        <section class=\"section\" id=\"animations\" aria-label=\"Анимации и переходы\">\n            <div class=\"container\">\n                <div class=\"section-header\">\n                    <div class=\"section-number\">09 · Анимации<\u002Fdiv>\n                    <h2 class=\"section-title\">Анимации и переходы<\u002Fh2>\n                    <p class=\"section-description\">\n                        Анимации должны быть ненавязчивыми и профессиональными. Они помогают расставить акценты, а не отвлекают.\n                    <\u002Fp>\n                <\u002Fdiv>\n\n                <div class=\"anim-grid\">\n                    <div class=\"anim-card\">\n                        <div class=\"anim-demo anim-fade\">Появление<\u002Fdiv>\n                        <h4>Плавное появление (Fade)<\u002Fh4>\n                        <p>Основной тип анимации для элементов. Мягкое появление без резких движений.<\u002Fp>\n                        <div class=\"anim-params\">Длительность: 0,3–0,5 с · Easing: ease-in-out<\u002Fdiv>\n                    <\u002Fdiv>\n                    <div class=\"anim-card\">\n                        <div class=\"anim-demo anim-slide\">Слайд<\u002Fdiv>\n                        <h4>Выдвижение (Slide)<\u002Fh4>\n                        <p>Для последовательных списков и блоков. Элементы появляются слева или снизу.<\u002Fp>\n                        <div class=\"anim-params\">Длительность: 0,4–0,6 с · Easing: ease-out<\u002Fdiv>\n                    <\u002Fdiv>\n                    <div class=\"anim-card\">\n                        <div class=\"anim-demo anim-scale\">Масштаб<\u002Fdiv>\n                        <h4>Масштабирование (Scale)<\u002Fh4>\n                        <p>Для выделения ключевых цифр и KPI. Увеличение от 80% до 100%.<\u002Fp>\n                        <div class=\"anim-params\">Длительность: 0,3–0,4 с · Easing: ease-out<\u002Fdiv>\n                    <\u002Fdiv>\n                <\u002Fdiv>\n\n                <div class=\"guide-box\">\n                    <h3>Переходы между слайдами<\u002Fh3>\n                    <ul style=\"margin-left: 20px; line-height: 1.9;\">\n                        <li><strong>Рекомендуемый:<\u002Fstrong> «Выцветание» (Fade) — универсальный, ненавязчивый переход<\u002Fli>\n                        <li><strong>Допустимый:<\u002Fstrong> «Проталкивание» (Push) — для разделов с чёткой структурой<\u002Fli>\n                        <li><strong>Запрещённый:<\u002Fstrong> «Шахматная доска», «Вертушка», «Разрыв» и другие декоративные эффекты<\u002Fli>\n                        <li><strong>Длительность перехода:<\u002Fstrong> 0,3–0,7 секунды, одинаковая для всей презентации<\u002Fli>\n                        <li><strong>Правило:<\u002Fstrong> один тип перехода на всю презентацию — не комбинируйте разные<\u002Fli>\n                    <\u002Ful>\n                <\u002Fdiv>\n            <\u002Fdiv>\n        <\u002Fsection>\n\n        <!-- 10 · Изображения и фотографии -->\n        <section class=\"section\" id=\"images\" aria-label=\"Изображения и фотографии\">\n            <div class=\"container\">\n                <div class=\"section-header\">\n                    <div class=\"section-number\">10 · Изображения<\u002Fdiv>\n                    <h2 class=\"section-title\">Изображения и фотографии<\u002Fh2>\n                    <p class=\"section-description\">\n                        Стиль изображений должен соответствовать общему тону презентаций: деловой, современный, сдержанный.\n                    <\u002Fp>\n                <\u002Fdiv>\n\n                <div class=\"img-styles-grid\">\n                    <div class=\"img-style-card\">\n                        <div class=\"img-style-preview photo-corporate\">\n                            <div class=\"img-style-preview-label\" style=\"color: #414b5f; font-family: var(--font-mono); font-weight: 400;\">место для примера:<br>деловая сцена, естественный свет<\u002Fdiv>\n                        <\u002Fdiv>\n                        <div class=\"img-style-info\">\n                            <h4>Корпоративная фотография<\u002Fh4>\n                            <p>Реалистичные, естественные фотографии. Без художественных фильтров и обработки. Предпочтение — деловым сценам, офисной среде, мероприятиям.<\u002Fp>\n                        <\u002Fdiv>\n                    <\u002Fdiv>\n                    <div class=\"img-style-card\">\n                        <div class=\"img-style-preview photo-overlay\">\n                            <div class=\"img-style-preview-label\">Текст поверх фото<\u002Fdiv>\n                        <\u002Fdiv>\n                        <div class=\"img-style-info\">\n                            <h4>Затемняющий оверлей<\u002Fh4>\n                            <p>При размещении текста поверх фотографии используйте оверлей #062a5f с прозрачностью 30–50 % (непрозрачность 0,5–0,7) для обеспечения читаемости.<\u002Fp>\n                        <\u002Fdiv>\n                    <\u002Fdiv>\n                    <div class=\"img-style-card\">\n                        <div class=\"img-style-preview photo-grid\">\n                            <div><\u002Fdiv><div><\u002Fdiv><div><\u002Fdiv><div><\u002Fdiv>\n                        <\u002Fdiv>\n                        <div class=\"img-style-info\">\n                            <h4>Фотомозаика и коллажи<\u002Fh4>\n                            <p>Для группировки нескольких фотографий используйте сетку с зазором 0,1 M и скруглением углов 0,15 M. Избегайте хаотичного расположения.<\u002Fp>\n                        <\u002Fdiv>\n                    <\u002Fdiv>\n                <\u002Fdiv>\n\n                <div class=\"guide-box\" style=\"margin-top: 32px;\">\n                    <h3>Правила работы с изображениями<\u002Fh3>\n                    <ul style=\"margin-left: 20px; line-height: 1.9;\">\n                        <li>Разрешение изображения — не ниже разрешения области вывода, которую оно занимает; не увеличивайте изображения больше 100 %<\u002Fli>\n                        <li>Предпочтение — оригинальным фотографиям, а не стоковым изображениям<\u002Fli>\n                        <li>Не растягивайте изображения — сохраняйте пропорции<\u002Fli>\n                        <li>Для фоновых изображений используйте затемнение или размытие<\u002Fli>\n                        <li>Избегайте клипартов, стикеров и устаревшей графики<\u002Fli>\n                        <li>Цветовой тон фотографий должен быть холодным или нейтральным<\u002Fli>\n                    <\u002Ful>\n                <\u002Fdiv>\n            <\u002Fdiv>\n        <\u002Fsection>\n\n    <\u002Fdiv><!-- /main-content -->\n\n    <!-- Footer -->\n    <footer class=\"footer\" role=\"contentinfo\">\n        <div class=\"footer-inner\">\n            <div>\n                <div class=\"footer-brand\">Брендбук · Единый стиль презентаций<\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"footer-meta\">\n                Версия 2.0 · Октябрь 2026\n            <\u002Fdiv>\n        <\u002Fdiv>\n    <\u002Ffooter>\n\n    <!-- JavaScript -->\n    <script>\n        // Copy color to clipboard\n        document.querySelectorAll('.color-card').forEach(card => {\n            card.addEventListener('click', () => {\n                const color = card.getAttribute('data-color');\n                if (color && navigator.clipboard) {\n                    navigator.clipboard.writeText(color).then(() => {\n                        const toast = document.getElementById('copyToast');\n                        toast.textContent = color + ' скопирован!';\n                        toast.classList.add('show');\n                        setTimeout(() => toast.classList.remove('show'), 2000);\n                    });\n                }\n            });\n            card.addEventListener('keydown', (e) => {\n                if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); card.click(); }\n            });\n        });\n\n        // Active nav link on scroll\n        const sections = document.querySelectorAll('section[id]');\n        const navLinks = document.querySelectorAll('.nav-list a');\n\n        function updateActiveNav() {\n            const scrollY = window.scrollY + 120;\n            sections.forEach(section => {\n                const top = section.offsetTop;\n                const height = section.offsetHeight;\n                const id = section.getAttribute('id');\n                const link = document.querySelector('.nav-list a[href=\"#' + id + '\"]');\n                if (link) {\n                    if (scrollY >= top && scrollY < top + height) {\n                        link.classList.add('active');\n                    } else {\n                        link.classList.remove('active');\n                    }\n                }\n            });\n        }\n\n        window.addEventListener('scroll', updateActiveNav, { passive: true });\n        updateActiveNav();\n    <\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
