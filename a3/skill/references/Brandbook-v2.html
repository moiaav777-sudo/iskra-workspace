  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

n            --font-main: 'Golos Text', Arial, sans-serif;\n            --font-mono: 'Courier New', monospace;\n            --radius: 12px;\n            --radius-sm: 8px;\n            --shadow: 0 4px 20px rgba(0, 0, 0, 0.08);\n            --shadow-lg: 0 8px 40px rgba(0, 0, 0, 0.12);\n            --transition: 0.3s ease;\n            --nav-width: 260px;\n        }\n\n        /* ===== Reset & Base ===== */\n        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }\n\n        html { scroll-behavior: smooth; scroll-padding-top: 80px; }\n\n        body {\n            font-family: var(--font-main);\n            line-height: 1.6;\n            color: var(--color-text);\n            background: var(--color-bg);\n        }\n\n        /* ===== Skip Link (Accessibility) ===== */\n        .skip-link {\n            position: absolute;\n            top: -100%;\n            left: 16px;\n            background: var(--color-primary);\n            color: #fff;\n            padding: 8px 16px;\n            border-radius: var(--radius-sm);\n            z-index: 10000;\n            font-size: 14px;\n            text-decoration: none;\n            transition: top var(--transition);\n        }\n        .skip-link:focus { top: 16px; }\n\n        /* ===== Sticky Navigation ===== */\n        .nav-sidebar {\n            position: fixed;\n            top: 0;\n            left: 0;\n            width: var(--nav-width);\n            height: 100vh;\n            background: var(--color-primary);\n            color: #fff;\n            padding: 24px 0;\n            overflow-y: auto;\n            z-index: 1000;\n            display: flex;\n            flex-direction: column;\n        }\n\n        .nav-logo {\n            padding: 0 24px 20px;\n            border-bottom: 1px solid rgba(255,255,255,0.15);\n            margin-bottom: 12px;\n        }\n        .nav-logo-title {\n            font-size: 16px;\n            font-weight: 700;\n            letter-spacing: 0.02em;\n        }\n        .nav-logo-sub {\n            font-size: 11px;\n            opacity: 0.6;\n            margin-top: 2px;\n        }\n\n        .nav-list {\n            list-style: none;\n            flex: 1;\n        }\n        .nav-list li { position: relative; }\n        .nav-list a {\n            display: flex;\n            align-items: center;\n            gap: 10px;\n            padding: 10px 24px;\n            color: rgba(255,255,255,0.7);\n            text-decoration: none;\n            font-size: 13px;\n            font-weight: 500;\n            transition: all var(--transition);\n            border-left: 3px solid transparent;\n        }\n        .nav-list a:hover {\n            color: #fff;\n            background: rgba(255,255,255,0.08);\n        }\n        .nav-list a.active {\n            color: #fff;\n            background: rgba(255,255,255,0.12);\n            border-left-color: var(--color-accent-light);\n        }\n        .nav-num {\n            font-size: 11px;\n            font-weight: 700;\n            opacity: 0.5;\n            min-width: 20px;\n        }\n\n        .nav-footer {\n            padding: 16px 24px;\n            border-top: 1px solid rgba(255,255,255,0.15);\n            font-size: 11px;\n            opacity: 0.5;\n            line-height: 1.5;\n        }\n\n        /* Main content offset for sidebar */\n        .main-content {\n            margin-left: var(--nav-width);\n        }\n\n        /* ===== Hero ===== */\n        .hero {\n            background: linear-gradient(135deg, var(--color-primary) 0%, #144696 100%);\n            color: #fff;\n            padding: 100px 60px 80px;\n            position: relative;\n            overflow: hidden;\n        }\n        .hero::after {\n            content: '';\n            position: absolute;\n            top: -50%;\n            right: -20%;\n            width: 600px;\n            height: 600px;\n            background: radial-gradient(circle, rgba(153,194,255,0.15) 0%, transparent 70%);\n            border-radius: 50%;\n        }\n        .hero h1 {\n            font-size: 56px;\n            font-weight: 800;\n            letter-spacing: -0.02em;\n            margin-bottom: 16px;\n            position: relative;\n            z-index: 1;\n        }\n        .hero-subtitle {\n            font-size: 20px;\n            opacity: 0.85;\n            max-width: 600px;\n            position: relative;\n            z-index: 1;\n        }\n        .hero-meta {\n            margin-top: 32px;\n            font-size: 13px;\n            opacity: 0.6;\n            position: relative;\n            z-index: 1;\n        }\n\n        /* ===== Sections ===== */\n        .section {\n            padding: 80px 60px;\n        }\n        .section:nth-child(even) { background: var(--color-surface); }\n\n        .section-header {\n            max-width: 900px;\n            margin: 0 auto 48px;\n            text-align: center;\n        }\n        .section-number {\n            display: inline-block;\n            font-size: 13px;\n            font-weight: 700;\n            color: var(--color-secondary);\n            letter-spacing: 0.08em;\n            text-transform: uppercase;\n            margin-bottom: 12px;\n            padding: 4px 12px;\n            background: rgba(20,70,150,0.08);\n            border-radius: 20px;\n        }\n        .section-title {\n            font-size: 36px;\n            font-weight: 700;\n            color: var(--color-primary);\n            margin-bottom: 12px;\n        }\n        .section-description {\n            font-size: 16px;\n            color: var(--color-text-secondary);\n            max-width: 640px;\n            margin: 0 auto;\n        }\n\n        .container { max-width: 1100px; margin: 0 auto; }\n\n        /* ===== Color Palette ===== */\n        .color-grid {\n            display: grid;\n            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));\n            gap: 20px;\n            margin-bottom: 40px;\n        }\n        .color-card {\n            background: var(--color-bg);\n            border-radius: var(--radius);\n            box-shadow: var(--shadow);\n            overflow: hidden;\n            cursor: pointer;\n            transition: transform var(--transition), box-shadow var(--transition);\n            position: relative;\n        }\n        .color-card:hover {\n            transform: translateY(-4px);\n            box-shadow: var(--shadow-lg);\n        }\n        .color-swatch {\n            height: 100px;\n            position: relative;\n        }\n        .color-copy-hint {\n            position: absolute;\n            bottom: 8px;\n            right: 8px;\n            background: rgba(0,0,0,0.5);\n            color: #fff;\n            font-size: 10px;\n            padding: 3px 8px;\n            border-radius: 4px;\n            opacity: 0;\n            transition: opacity var(--transition);\n        }\n        .color-card:hover .color-copy-hint { opacity: 1; }\n        .color-info {\n            padding: 16px;\n        }\n        .color-name {\n            font-size: 14px;\n            font-weight: 600;\n            color: var(--color-primary);\n            margin-bottom: 4px;\n        }\n        .color-hex {\n            font-family: var(--font-mono);\n            font-size: 13px;\n            color: var(--color-text-secondary);\n        }\n        .color-usage {\n            font-size: 12px;\n            color: var(--color-text-secondary);\n            margin-top: 8px;\n            line-height: 1.5;\n        }\n\n        .color-copied-toast {\n            position: fixed;\n            bottom: 30px;\n            left: 50%;\n            transform: translateX(-50%) translateY(100px);\n            background: var(--color-primary);\n            color: #fff;\n            padding: 12px 24px;\n            border-radius: var(--radius-sm);\n            font-size: 14px;\n            font-weight: 500;\n            z-index: 9999;\n            transition: transform 0.4s ease;\n            pointer-events: none;\n        }\n        .color-copied-toast.show {\n            transform: translateX(-50%) translateY(0);\n        }\n\n        .rules-box {\n            background: var(--color-bg);\n            border-radius: var(--radius);\n            padding: 28px 32px;\n            border-left: 4px solid var(--color-secondary);\n            box-shadow: var(--shadow);\n        }\n        .rules-box h3 {\n            font-size: 18px;\n            color: var(--color-primary);\n            margin-bottom: 14px;\n        }\n        .rules-box ul {\n            margin-left: 20px;\n            color: var(--color-text);\n            line-height: 1.9;\n        }\n\n        /* ===== Typography ===== */\n        .type-showcase {\n            display: flex;\n            flex-direction: column;\n            gap: 32px;\n            margin-bottom: 40px;\n        }\n        .type-item {\n            background: var(--color-bg);\n            border-radius: var(--radius);\n            box-shadow: var(--shadow);\n            overflow: hidden;\n        }\n        .type-preview {\n            padding: 32px;\n            border-bottom: 1px solid var(--color-border);\n        }\n        .type-meta {\n            display: flex;\n            flex-wrap: wrap;\n            gap: 16px;\n            padding: 16px 32px;\n            background: var(--color-surface);\n            font-size: 13px;\n            color: var(--color-text-secondary);\n        }\n        .type-meta-item { display: flex; gap: 6px; }\n        .type-meta-label { font-weight: 600; color: var(--color-primary); }\n\n        .font-recommendations {\n            background: var(--color-bg);\n            border-radius: var(--radius);\n            padding: 28px 32px;\n            box-shadow: var(--shadow);\n        }\n        .font-recommendations h3 {\n            font-size: 18px;\n            color: var(--color-primary);\n            margin-bottom: 14px;\n        }\n\n        /* ===== Composition ===== */\n        .comp-grid {\n            display: grid;\n            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));\n            gap: 24px;\n            margin-bottom: 40px;\n        }\n        .comp-card {\n            background: var(--color-bg);\n            border-radius: var(--radius);\n            padding: 28px;\n            box-shadow: var(--shadow);\n        }\n        .comp-card h3 {\n            font-size: 18px;\n            color: var(--color-primary);\n            margin-bottom: 14px;\n        }\n        .comp-card ul {\n            margin-left: 18px;\n            line-height: 1.9;\n            color: var(--color-text);\n        }\n\n        .format-demo {\n            background: var(--color-bg);\n            border-radius: var(--radius);\n            padding: 32px;\n            box-shadow: var(--shadow);\n            display: flex;\n            justify-content: center;\n            margin-bottom: 40px;\n        }\n        .format-ratio {\n            width: 320px;\n            height: 180px;\n            border: 2px solid var(--color-secondary);\n            border-radius: var(--radius-sm);\n            position: relative;\n            display: flex;\n            align-items: center;\n            justify-content: center;\n            background: repeating-linear-gradient(\n                45deg,\n                transparent,\n                transparent 10px,\n                rgba(20,70,150,0.03) 10px,\n                rgba(20,70,150,0.03) 20px\n            );\n        }\n        .format-ratio span {\n            background: var(--color-secondary);\n            color: #fff;\n            padding: 6px 16px;\n            border-radius: 20px;\n            font-size: 14px;\n            font-weight: 600;\n        }\n        .format-dim {\n            position: absolute;\n            font-size: 12px;\n            color: var(--color-text-secondary);\n            font-weight: 500;\n        }\n        .format-dim.bottom { bottom: -24px; }\n        .format-dim.right { right: -60px; }\n\n        /* ===== Graphics ===== */\n        .graphics-grid {\n            display: grid;\n            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));\n            gap: 24px;\n        }\n        .graphic-card {\n            background: var(--color-bg);\n            border-radius: var(--radius);\n            padding: 28px;\n            box-shadow: var(--shadow);\n            text-align: center;\n        }\n        .graphic-icon {\n            width: 64px;\n            height: 64px;\n            margin: 0 auto 16px;\n            display: flex;\n            align-items: center;\n            justify-content: center;\n        }\n        .graphic-icon svg {\n            width: 48px;\n            height: 48px;\n        }\n        .graphic-card h3 {\n            font-size: 16px;\n            color: var(--color-primary);\n            margin-bottom: 8px;\n        }\n        .graphic-card p {\n            font-size: 14px;\n            color: var(--color-text-secondary);\n            line-height: 1.6;\n        }\n\n        /* ===== Charts ===== */\n        .charts-grid {\n            display: grid;\n            grid-template-columns: repeat(auto-fit, minmax(460px, 1fr));\n            gap: 24px;\n            margin-bottom: 40px;\n        }\n        .chart-card {\n            background: var(--color-bg);\n            border-radius: var(--radius);\n            box-shadow: var(--shadow);\n            overflow: hidden;\n        }\n        .chart-card-header {\n            padding: 18px 24px;\n            border-bottom: 1px solid var(--color-border);\n        }\n        .chart-card-header h3 { font-size: 16px; font-weight: 600; color: var(--color-primary); margin-bottom: 2px; }\n        .chart-card-header p { font-size: 12px; color: var(--color-text-secondary); }\n        .chart-card-body { padding: 28px 24px; }\n\n        /* Bar Chart */\n        .bar-chart {\n            display: flex;\n            align-items: flex-end;\n            gap: 20px;\n            height: 180px;\n            padding-bottom: 28px;\n            border-bottom: 2px solid var(--color-border);\n        }\n        .bar-group { flex: 1; display: flex; flex-direction: column; align-items: center; height: 100%; justify-content: flex-end; }\n        .bar {\n            width: 100%;\n            max-width: 56px;\n            border-radius: 6px 6px 0 0;\n            position: relative;\n            transition: all var(--transition);\n        }\n        .bar:hover { opacity: 0.85; transform: scaleY(1.03); transform-origin: bottom; }\n        .bar-value {\n            position: absolute;\n            top: -22px;\n            left: 50%;\n            transform: translateX(-50%);\n            font-size: 13px;\n            font-weight: 700;\n            color: var(--color-primary);\n        }\n        .bar-label { margin-top: 8px; font-size: 12px; color: var(--color-text-secondary); font-weight: 500; }\n\n        /* Donut Chart */\n        .donut-container { display: flex; align-items: center; gap: 28px; }\n        .donut-svg { width: 160px; height: 160px; flex-shrink: 0; }\n        .donut-legend { display: flex; flex-direction: column; gap: 10px; }\n        .legend-item { display: flex; align-items: center; gap: 8px; font-size: 13px; }\n        .legend-dot { width: 12px; height: 12px; border-radius: 3px; flex-shrink: 0; }\n\n        /* Line Chart */\n        .line-chart-container { position: relative; height: 180px; }\n        .line-chart-svg { width: 100%; height: 100%; }\n\n        /* Horizontal Bar */\n        .h-bar-chart { display: flex; flex-direction: column; gap: 14px; }\n        .h-bar-row { display: flex; align-items: center; gap: 12px; }\n        .h-bar-label { width: 80px; font-size: 13px; color: var(--color-text); font-weight: 500; text-align: right; flex-shrink: 0; }\n        .h-bar-track { flex: 1; height: 28px; background: var(--color-surface); border-radius: 6px; overflow: hidden; }\n        .h-bar-fill {\n            height: 100%;\n            border-radius: 6px;\n            display: flex;\n            align-items: center;\n            justify-content: flex-end;\n            padding-right: 10px;\n            font-size: 12px;\n            font-weight: 600;\n            color: #fff;\n            transition: width 0.6s ease;\n        }\n\n        /* KPI Cards */\n        .kpi-row { display: flex; gap: 16px; }\n        .kpi-card {\n            flex: 1;\n            background: var(--color-surface);\n            border-radius: var(--radius-sm);\n            padding: 20px 16px;\n            text-align: center;\n            border-top: 3px solid var(--color-secondary);\n        }\n        .kpi-card.accent-green { border-top-color: var(--color-green); }\n        .kpi-card.accent-light { border-top-color: var(--color-accent-light); }\n        .kpi-value { display: block; font-size: 32px; font-weight: 800; color: var(--color-primary); }\n        .kpi-label { display: block; font-size: 12px; color: var(--color-text-secondary); margin-top: 4px; }\n        .kpi-trend { display: inline-block; font-size: 12px; font-weight: 600; color: var(--color-green-text); margin-top: 6px; }\n\n        /* Stacked Bar */\n        .stacked-bar-chart { display: flex; flex-direction: column; gap: 14px; }\n        .stacked-row { display: flex; align-items: center; gap: 12px; }\n        .stacked-label { width: 48px; font-size: 13px; font-weight: 600; color: var(--color-primary); flex-shrink: 0; }\n        .stacked-track { flex: 1; height: 32px; display: flex; border-radius: 6px; overflow: hidden; }\n        .stacked-segment {\n            display: flex;\n            align-items: center;\n            justify-content: center;\n            font-size: 11px;\n            font-weight: 600;\n            color: #fff;\n            transition: width 0.6s ease;\n        }\n\n        /* Chart Rules */\n        .chart-rules {\n            display: grid;\n            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));\n    flex-direction: column;\n            justify-content: center;\n            padding: 32px 40px;\n            position: relative;\n        }\n        .mockup-title-slide::after {\n            content: '';\n            position: absolute;\n            top: -30%;\n            right: -15%;\n            width: 200px;\n            height: 200px;\n            background: radial-gradient(circle, rgba(153,194,255,0.2) 0%, transparent 70%);\n            border-radius: 50%;\n        }\n        .mockup-logo-placeholder {\n            position: absolute;\n            top: 16px;\n            left: 20px;\n            font-size: 10px;\n            font-weight: 700;\n            color: rgba(255,255,255,0.8);\n            letter-spacing: 0.1em;\n        }\n        .mockup-title-slide h4 {\n            color: #fff;\n            font-size: 22px;\n            font-weight: 700;\n            line-height: 1.3;\n            position: relative;\n            z-index: 1;\n        }\n        .mockup-title-slide .subtitle {\n            color: rgba(255,255,255,0.7);\n            font-size: 12px;\n            margin-top: 10px;\n            position: relative;\n            z-index: 1;\n        }\n\n        /* Content Slide Mockup */\n        .mockup-content-slide {\n            background: #fff;\n            padding: 24px 32px;\n            display: flex;\n            flex-direction: column;\n        }\n        .mockup-section-num {\n            position: absolute;\n            top: 12px;\n            right: 16px;\n            font-size: 24px;\n            font-weight: 800;\n            color: var(--color-accent-light);\n            opacity: 0.6;\n        }\n        .mockup-content-slide h5 {\n            font-size: 15px;\n            font-weight: 600;\n            color: var(--color-secondary);\n            text-transform: uppercase;\n            margin-bottom: 12px;\n        }\n        .mockup-text-line {\n            height: 6px;\n            background: var(--color-surface);\n            border-radius: 3px;\n            margin-bottom: 8px;\n        }\n        .mockup-text-line:nth-child(2) { width: 100%; }\n        .mockup-text-line:nth-child(3) { width: 92%; }\n        .mockup-text-line:nth-child(4) { width: 85%; }\n        .mockup-text-line:nth-child(5) { width: 70%; }\n        .mockup-content-bar {\n            position: absolute;\n            bottom: 0;\n            left: 0;\n            right: 0;\n            height: 4px;\n            background: var(--color-accent-light);\n        }\n\n        /* Data Slide Mockup */\n        .mockup-data-slide {\n            background: #fff;\n            padding: 24px 32px;\n            display: flex;\n            align-items: center;\n            justify-content: center;\n            gap: 24px;\n        }\n        .mockup-kpi {\n            text-align: center;\n        }\n        .mockup-kpi-value {\n            font-size: 36px;\n            font-weight: 800;\n            color: var(--color-primary);\n            line-height: 1;\n        }\n        .mockup-kpi-label {\n            font-size: 10px;\n            color: var(--color-text-secondary);\n            margin-top: 4px;\n        }\n        .mockup-kpi-trend {\n            font-size: 11px;\n            font-weight: 600;\n            color: var(--color-green-text);\n        }\n        .mockup-kpi-trend.down { color: var(--color-red-text); }\n        .mockup-divider {\n            width: 1px;\n            height: 60px;\n            background: var(--color-border);\n        }\n\n        /* Section Divider Mockup */\n        .mockup-divider-slide {\n            background: var(--color-primary);\n            display: flex;\n            flex-direction: column;\n            align-items: center;\n            justify-content: center;\n            text-align: center;\n        }\n        .mockup-divider-slide .big-num {\n            font-size: 64px;\n            font-weight: 800;\n            color: var(--color-accent-light);\n            opacity: 0.5;\n            line-height: 1;\n        }\n        .mockup-divider-slide .section-name {\n            font-size: 18px;\n            font-weight: 600;\n            color: #fff;\n            margin-top: 8px;\n        }\n\n        /* ===== Do & Don't ===== */\n        .dodont-grid {\n            display: grid;\n            grid-template-columns: 1fr 1fr;\n            gap: 24px;\n        }\n        .dodont-col h3 {\n            font-size: 18px;\n            font-weight: 700;\n            margin-bottom: 16px;\n            display: flex;\n            align-items: center;\n            gap: 8px;\n        }\n        .dodont-col.do-col h3 { color: var(--color-green-text); }\n        .dodont-col.dont-col h3 { color: var(--color-red-text); }\n        .dodont-item {\n            background: var(--color-bg);\n            border-radius: var(--radius-sm);\n            padding: 16px 20px;\n            margin-bottom: 12px;\n            box-shadow: var(--shadow);\n            font-size: 14px;\n            line-height: 1.6;\n            color: var(--color-text);\n            border-left: 3px solid transparent;\n        }\n        .do-col .dodont-item { border-left-color: var(--color-green); }\n        .dont-col .dodont-item { border-left-color: var(--color-red); }\n\n        /* ===== Animations ===== */\n        .anim-grid {\n            display: grid;\n            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));\n            gap: 20px;\n            margin-bottom: 32px;\n        }\n        .anim-card {\n            background: var(--color-bg);\n            border-radius: var(--radius);\n            padding: 24px;\n            box-shadow: var(--shadow);\n            text-align: center;\n        }\n        .anim-demo {\n            width: 80px;\n            height: 80px;\n            margin: 0 auto 16px;\n            background: linear-gradient(135deg, var(--color-secondary), var(--color-accent-light));\n            border-radius: var(--radius-sm);\n            display: flex;\n            align-items: center;\n            justify-content: center;\n            color: #fff;\n            font-size: 11px;\n            font-weight: 600;\n        }\n        .anim-fade { animation: fadeDemo 2s ease-in-out infinite; }\n        .anim-slide { animation: slideDemo 2s ease-in-out infinite; }\n        .anim-scale { animation: scaleDemo 2s ease-in-out infinite; }\n        @keyframes fadeDemo { 0%,100% { opacity: 0.3; } 50% { opacity: 1; } }\n        @keyframes slideDemo { 0%,100% { transform: translateX(-20px); opacity: 0.3; } 50% { transform: translateX(0); opacity: 1; } }\n        @keyframes scaleDemo { 0%,100% { transform: scale(0.8); opacity: 0.3; } 50% { transform: scale(1); opacity: 1; } }\n        .anim-card h4 { font-size: 15px; color: var(--color-primary); margin-bottom: 6px; }\n        .anim-card p { font-size: 13px; color: var(--color-text-secondary); }\n        .anim-card .anim-params {\n            margin-top: 10px;\n            font-family: var(--font-mono);\n            font-size: 11px;\n            color: var(--color-secondary);\n            background: var(--color-surface);\n            padding: 6px 10px;\n            border-radius: 4px;\n            display: inline-block;\n        }\n\n        /* ===== Images & Photos ===== */\n        .img-styles-grid {\n            display: grid;\n            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));\n            gap: 24px;\n        }\n        .img-style-card {\n            background: var(--color-bg);\n            border-radius: var(--radius);\n            overflow: hidden;\n            box-shadow: var(--shadow);\n        }\n        .img-style-preview {\n            height: 140px;\n            display: flex;\n            align-items: center;\n            justify-content: center;\n            position: relative;\n        }\n        .img-style-preview.photo-corporate {\n            background: repeating-linear-gradient(45deg, #f8f9fa 0, #f8f9fa 10px, #e8eef8 10px, #e8eef8 20px);\n        }\n        .img-style-preview.photo-overlay {\n            background: linear-gradient(135deg, #3a6bc5 0%, #5a8fd4 100%);\n        }\n        .img-style-preview.photo-overlay::after {\n            content: '';\n            position: absolute;\n            inset: 0;\n            background: rgba(6,42,95,0.5);\n        }\n        .img-style-preview.photo-grid {\n            background: var(--color-surface);\n            display: grid;\n            grid-template-columns: 1fr 1fr;\n            gap: 4px;\n            padding: 4px;\n        }\n        .img-style-preview.photo-grid div {\n            border-radius: 4px;\n        }\n        .img-style-preview.photo-grid div:nth-child(1) { background: linear-gradient(135deg, #062a5f, #144696); }\n        .img-style-preview.photo-grid div:nth-child(2) { background: linear-gradient(135deg, #144696, #99c2ff); }\n        .img-style-preview.photo-grid div:nth-child(3) { background: linear-gradient(135deg, #99c2ff, #98a8f8); }\n        .img-style-preview.photo-grid div:nth-child(4) { background: linear-gradient(135deg, #98a8f8, #062a5f); }\n        .img-style-preview-label {\n            color: #fff;\n            font-size: 12px;\n            font-weight: 600;\n            z-index: 1;\n            text-align: center;\n            padding: 8px;\n        }\n        .img-style-info {\n            padding: 18px 20px;\n        }\n        .img-style-info h4 { font-size: 15px; color: var(--color-primary); margin-bottom: 6px; }\n        .img-style-info p { font-size: 13px; color: var(--color-text-secondary); line-height: 1.5; }\n\n        /* ===== Footer ===== */\n        .footer {\n            background: var(--color-primary);\n            color: #fff;\n            padding: 40px 60px;\n            margin-left: var(--nav-width);\n        }\n        .footer-inner {\n            max-width: 1100px;\n            margin: 0 auto;\n            display: flex;\n            justify-content: space-between;\n            align-items: center;\n            flex-wrap: wrap;\n            gap: 20px;\n        }\n        .footer-brand {\n            font-size: 14px;\n            font-weight: 600;\n        }\n        .footer-meta {\n            font-size: 12px;\n            opacity: 0.6;\n            text-align: right;\n            line-height: 1.6;\n        }\n\n        /* ===== Palette extras ===== */\n        .palette-subtitle { font-size: 18px; font-weight: 600; color: var(--color-primary); margin: 8px 0 6px; }\n        .palette-note { font-size: 14px; color: var(--color-text-secondary); margin-bottom: 16px; }\n        .contrast-table, .data-table { width: 100%; border-collapse: collapse; font-size: 14px; }\n        .contrast-table th, .data-table th { text-align: left; font-weight: 600; padding: 10px 14px; }\n        .contrast-table th { color: var(--color-primary); border-bottom: 2px solid var(--color-border); }\n        .contrast-table td { padding: 10px 14px; border-bottom: 1px solid var(--color-border); vertical-align: middle; }\n        .contrast-sample { display: inline-flex; align-items: center; justify-content: center; width: 56px; height: 36px; border-radius: 6px; font-weight: 700; font-size: 16px; border: 1px solid var(--color-border); }\n        .verdict-ok { color: var(--color-green-text); font-weight: 600; }\n        .verdict-limited { color: var(--color-orange-text); font-weight: 600; }\n        .verdict-no { color: var(--color-red-text); font-weight: 600; }\n        .table-wrap { background: var(--color-bg); border-radius: var(--radius); box-shadow: var(--shadow); padding: 24px; margin-bottom: 40px; overflow-x: auto; }\n        .table-wrap > h3 { font-size: 16px; font-weight: 600; color: var(--color-primary); margin-bottom: 4px; }\n        .table-wrap > p { font-size: 12px; color: var(--color-text-secondary); margin-bottom: 16px; }\n        .data-table th { background: var(--color-primary); color: #fff; }\n        .data-table td { padding: 10px 14px; border-bottom: 1px solid var(--color-border); }\n        .data-table tbody tr:nth-child(even) td { background: var(--color-surface); }\n        .data-table tr.row-total td { font-weight: 700; color: var(--color-primary); border-top: 2px solid var(--color-secondary); background: var(--color-tint); }\n        .data-table .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }\n        .chart-unit { font-size: 12px; color: var(--color-text-secondary); margin-bottom: 24px; }\n        .chart-source { font-size: 12px; color: var(--color-text-secondary); margin-top: 12px; }\n        .line-chart-container { padding-left: 32px; }\n        .y-label { position: absolute; left: 0; font-size: 11px; color: var(--color-text-secondary); transform: translateY(-50%); }\n        .x-labels { display: flex; justify-content: space-between; padding-left: 32px; margin-top: 8px; font-size: 11px; color: var(--color-text-secondary); }\n        .mockup-page-num { position: absolute; bottom: 10px; right: 16px; font-size: 9px; color: var(--color-text-secondary); }\n        .mockup-source { position: absolute; bottom: 10px; left: 32px; font-size: 9px; color: var(--color-text-secondary); }\n\n        /* ===== Responsive ===== */\n        @media (max-width: 1024px) {\n            .nav-sidebar { position: sticky; width: 100%; height: auto; padding: 0; }\n            .nav-logo, .nav-footer { display: none; }\n            .nav-list { display: flex; overflow-x: auto; }\n            .nav-list a { white-space: nowrap; padding: 14px 16px; border-left: none; border-bottom: 3px solid transparent; }\n            .nav-list a.active { border-bottom-color: var(--color-accent-light); }\n            .main-content { margin-left: 0; }\n            .footer { margin-left: 0; }\n            .hero { padding: 60px 24px 48px; }\n            .hero h1 { font-size: 36px; }\n            .section { padding: 48px 24px; }\n            .dodont-grid { grid-template-columns: 1fr; }\n            .mockups-grid { grid-template-columns: 1fr; }\n            .charts-grid { grid-template-columns: 1fr; }\n        }\n\n        /* ===== Print ===== */\n        @media print {\n            .nav-sidebar, .skip-link, .color-copy-hint, .color-copied-toast { display: none !important; }\n            .main-content, .footer { margin-left: 0; }\n            .hero { padding: 40px; -webkit-print-color-adjust: exact; print-color-adjust: exact; }\n            .section { padding: 32px 24px; }\n            .color-card, .chart-card, .mockup-card, .comp-card, .graphic-card, .chart-rule, .dodont-item, .type-item, .table-wrap, .contrast-table tr { break-inside: avoid; }\n            .color-card, .chart-card, .mockup-card, .comp-card, .graphic-card { box-shadow: none; border: 1px solid #ddd; }\n            .anim-demo { animation: none !important; }\n            body { font-size: 11pt; }\n            .section-title { font-size: 24pt; }\n            a { color: inherit; text-decoration: none; }\n        }\n    <\u002Fstyle>\n<\u002Fhead>\n<body>\n\n\n    <!-- Skip Link -->\n    <a href=\"#main\" class=\"skip-link\">Перейти к содержимому<\u002Fa>\n\n    <!-- Toast for copy -->\n    <div class=\"color-copied-toast\" id=\"copyToast\">Скопировано!<\u002Fdiv>\n\n    <!-- Navigation Sidebar -->\n    <nav class=\"nav-sidebar\" role=\"navigation\" aria-label=\"Навигация по брендбуку\">\n        <div class=\"nav-logo\">\n            <div class=\"nav-logo-title\">Брендбук<\u002Fdiv>\n            <div class=\"nav-logo-sub\">Единый стиль презентаций<\u002Fdiv>\n        <\u002Fdiv>\n        <ul class=\"nav-list\">\n            <li><a href=\"#intro\"><span class=\"nav-num\">01<\u002Fspan> Введение<\u002Fa><\u002Fli>\n            <li><a href=\"#colors\"><span class=\"nav-num\">02<\u002Fspan> Цветовая палитра<\u002Fa><\u002Fli>\n            <li><a href=\"#typography\"><span class=\"nav-num\">03<\u002Fspan> Типографика<\u002Fa><\u002Fli>\n            <li><a href=\"#composition\"><span class=\"nav-num\">04<\u002Fspan> Композиция<\u002Fa><\u002Fli>\n            <li><a href=\"#graphics\"><span class=\"nav-num\">05<\u002Fspan> Графические элементы<\u002Fa><\u002Fli>\n            <li><a href=\"#charts\"><span class=\"nav-num\">06<\u002Fspan> Графики и таблицы<\u002Fa><\u002Fli>\n            <li><a href=\"#examples\"><span class=\"nav-num\">07<\u002Fspan> Примеры слайдов<\u002Fa><\u002Fli>\n            <li><a href=\"#dodont\"><span class=\"nav-num\">08<\u002Fspan> Можно и нельзя<\u002Fa><\u002Fli>\n            <li><a href=\"#animations\"><span class=\"nav-num\">09<\u002Fspan> Анимации<\u002Fa><\u002Fli>\n            <li><a href=\"#images\"><span class=\"nav-num\">10<\u002Fspan> Изображения<\u002Fa><\u002Fli>\n        <\u002Ful>\n        <div class=\"nav-footer\">\n            Версия 2.0<br>\n            Октябрь 2026\n        <\u002Fdiv>\n    <\u002Fnav>\n\n    <!-- Main Content -->\n    <div class=\"main-content\" id=\"main\">\n\n        <!-- Hero -->\n        <header class=\"hero\">\n            <h1>Брендбук<\u002Fh1>\n            <p class=\"hero-subtitle\">Единый визуальный стиль для подготовки презентаций. Все рекомендации основаны на анализе 13 корпоративных материалов.<\u002Fp>\n            <p class=\"hero-meta\">Версия 2.0 · Октябрь 2026<\u002Fp>\n        <\u002Fheader>\n\n        <!-- 01 · Введение -->\n        <section class=\"section\" id=\"intro\" aria-label=\"Введение\">\n            <div class=\"container\">\n                <div class=\"section-header\">\n                    <div class=\"section-number\">01 · Введение<\u002Fdiv>\n                    <h2 class=\"section-title\">О брендбуке<\u002Fh2>\n                    <p class=\"section-description\">\n                        Этот документ описывает единый визуальный стиль для создания презентаций. Все рекомендации основаны на анализе существующих материалов и направлены на обеспечение визуальной согласованности и профессионального вида.\n                    <\u002Fp>\n                <\u002Fdiv>\n\n                <div class=\"comp-grid\" style=\"margin-bottom: 0;\">\n                    <div class=\"comp-card\">\n                        <h3>Назначение<\u002Fh3>\n                        <p style=\"font-size: 14px; color: var(--color-text-secondary);\">Брендбук задаёт правила оформления всех презентаций: цвета, шрифт, сетку, графики, таблицы, изображения и анимацию.<\u002Fp>\n                    <\u002Fdiv>\n                    <div class=\"comp-card\">\n                        <h3>Как применять<\u002Fh3>\n                        <p style=\"font-size: 14px; color: var(--color-text-secondary);\">Создавайте презентацию в утверждённом шаблоне PowerPoint (.potx) на его мастер-слайдах. Перед отправкой проверьте её по разделу 08 «Можно и нельзя».<\u002Fp>\n                    <\u002Fdiv>\n                    <div class=\"comp-card\">\n                        <h3>Единицы измерения<\u002Fh3>\n                        <p style=\"font-size: 14px; color: var(--color-text-secondary);\">Формат и размер слайда задаёт система компоновки. Все размеры в брендбуке выражены через модуль M = высота рабочей области ÷ 18 и масштабируются под любой формат.<\u002Fp>\n                    <\u002Fdiv>\n                    <div class=\"comp-card\">\n                        <h3>Ответственный и версии<\u002Fh3>\n                        <p style=\"font-size: 14px; color: var(--color-text-secondary);\">Ответственный: [ФИО, должность, e-mail]. Изменения вносит только ответственный, каждая правка повышает номер версии.<\u002Fp>\n                    <\u002Fdiv>\n                <\u002Fdiv>\n            <\u002Fdiv>\n        <\u002Fsection>\n\n        <!-- 02 · Цветовая палитра -->\n        <section class=\"section\" id=\"colors\" aria-label=\"Цветовая палитра\">\n            <div class=\"container\">\n                <div class=\"section-header\">\n                    <div class=\"section-number\">02 · Цветовая палитра<\u002Fdiv>\n                    <h2 class=\"section-title\">Основные цвета<\u002Fh2>\n                    <p class=\"section-description\">\n                        Синяя цветовая гамма является основой визуальной идентичности. Она передаёт доверие, стабильность и авторитет. Нажмите на цвет, чтобы скопировать HEX-код.\n                    <\u002Fp>\n                <\u002Fdiv>\n\n                <h3 class=\"palette-subtitle\">Основные цвета<\u002Fh3>\n                <p class=\"palette-note\">Синяя гамма и белый — основа всех слайдов.<\u002Fp>\n                <div class=\"color-grid\">\n                    <div class=\"color-card\" data-color=\"#062a5f\" tabindex=\"0\" role=\"button\" aria-label=\"Скопировать цвет #062a5f\">\n                        <div class=\"color-swatch\" style=\"background: #062a5f;\">\n                            <span class=\"color-copy-hint\">Нажмите, чтобы скопировать<\u002Fspan>\n                        <\u002Fdiv>\n                        <div class=\"color-info\">\n                            <div class=\"color-name\">Тёмно-синий (основной)<\u002Fdiv>\n                            <div class=\"color-hex\">#062a5f · RGB 6, 42, 95<\u002Fdiv>\n                            <div class=\"color-usage\">Фоны титульных и разделительных слайдов, заголовки, крупные цифры, первая серия в графиках<\u002Fdiv>\n                        <\u002Fdiv>\n                    <\u002Fdiv>\n                    <div class=\"color-card\" data-color=\"#144696\" tabindex=\"0\" role=\"button\" aria-label=\"Скопировать цвет #144696\">\n                        <div class=\"color-swatch\" style=\"background: #144696;\">\n                            <span class=\"color-copy-hint\">Нажмите, чтобы скопировать<\u002Fspan>\n                        <\u002Fdiv>\n                        <div class=\"color-info\">\n                            <div class=\"color-name\">Синий (вторичный)<\u002Fdiv>\n                            <div class=\"color-hex\">#144696 · RGB 20, 70, 150<\u002Fdiv>\n                            <div class=\"color-usage\">Заголовки слайдов, подзаголовки, иконки, линии, вторая серия в графиках<\u002Fdiv>\n                        <\u002Fdiv>\n                    <\u002Fdiv>\n                    <div class=\"color-card\" data-color=\"#99c2ff\" tabindex=\"0\" role=\"button\" aria-label=\"Скопировать цвет #99c2ff\">\n                        <div class=\"color-swatch\" style=\"background: #99c2ff;\">\n                            <span class=\"color-copy-hint\">Нажмите, чтобы скопировать<\u002Fspan>\n                        <\u002Fdiv>\n                        <div class=\"color-info\">\n                            <div class=\"color-name\">Светло-синий (акцентный)<\u002Fdiv>\n                            <div class=\"color-hex\">#99c2ff · RGB 153, 194, 255<\u002Fdiv>\n                            <div class=\"color-usage\">Декор, подложки, номера секций, третья серия в графиках. Текст на нём — только тёмно-синий<\u002Fdiv>\n                        <\u002Fdiv>\n                    <\u002Fdiv>\n                    <div class=\"color-card\" data-color=\"#98a8f8\" tabindex=\"0\" role=\"button\" aria-label=\"Скопировать цвет #98a8f8\">\n                        <div class=\"color-swatch\" style=\"background: #98a8f8;\">\n                            <span class=\"color-copy-hint\">Нажмите, чтобы скопировать<\u002Fspan>\n                        <\u002Fdiv>\n                        <div class=\"color-info\">\n                            <div class=\"color-name\">Лавандовый (дополнительный)<\u002Fdiv>\n                            <div class=\"color-hex\">#98a8f8 · RGB 152, 168, 248<\u002Fdiv>\n                            <div class=\"color-usage\">Подложки, четвёртая серия в графиках. Текст на нём — только тёмно-синий<\u002Fdiv>\n                        <\u002Fdiv>\n                    <\u002Fdiv>\n                    <div class=\"color-card\" data-color=\"#ffffff\" tabindex=\"0\" role=\"button\" aria-label=\"Скопировать цвет #ffffff\">\n                        <div class=\"color-swatch\" style=\"background: #ffffff; border-bottom: 1px solid #e5e5e5;\">\n                            <span class=\"color-copy-hint\">Нажмите, чтобы скопировать<\u002Fspan>\n                        <\u002Fdiv>\n                        <div class=\"color-info\">\n                            <div class=\"color-name\">Белый (фон)<\u002Fdiv>\n                            <div class=\"color-hex\">#ffffff · RGB 255, 255, 255<\u002Fdiv>\n                            <div class=\"color-usage\">Основной фон контентных слайдов, текст на тёмно-синем и синем фоне<\u002Fdiv>\n                        <\u002Fdiv>\n                    <\u002Fdiv>\n                <\u002Fdiv>\n\n                <h3 class=\"palette-subtitle\">Смысловые цвета<\u002Fh3>\n                <p class=\"palette-note\">Каждый цвет закреплён за одним значением и не используется для обычных категорий.<\u002Fp>\n                <div class=\"color-grid\">\n                    <div class=\"color-card\" data-color=\"#55a555\" tabindex=\"0\" role=\"button\" aria-label=\"Скопировать цвет #55a555\">\n                        <div class=\"color-swatch\" style=\"background: #55a555;\">\n                            <span class=\"color-copy-hint\">Нажмите, чтобы скопировать<\u002Fspan>\n                        <\u002Fdiv>\n                        <div class=\"color-info\">\n                            <div class=\"color-name\">Зелёный (рост)<\u002Fdiv>\n                            <div class=\"color-hex\">#55a555 · RGB 85, 165, 85<\u002Fdiv>\n                            <div class=\"color-usage\">Только положительная динамика и выполненные показатели: заливки, маркеры, линии<\u002Fdiv>\n                        <\u002Fdiv>\n                    <\u002Fdiv>\n                    <div class=\"color-card\" data-color=\"#f84848\" tabindex=\"0\" role=\"button\" aria-label=\"Скопировать цвет #f84848\">\n                        <div class=\"color-swatch\" style=\"background: #f84848;\">\n                            <span class=\"color-copy-hint\">Нажмите, чтобы скопировать<\u002Fspan>\n                        <\u002Fdiv>\n                        <div class=\"color-info\">\n                            <div class=\"color-name\">Красный (снижение, риск)<\u002Fdiv>\n                            <div class=\"color-hex\">#f84848 · RGB 248, 72, 72<\u002Fdiv>\n                            <div class=\"color-usage\">Только отрицательная динамика, риски, отклонения: заливки, маркеры, линии<\u002Fdiv>\n                        <\u002Fdiv>\n                    <\u002Fdiv>\n                    <div class=\"color-card\" data-color=\"#f5a623\" tabindex=\"0\" role=\"button\" aria-label=\"Скопировать цвет #f5a623\">\n                        <div class=\"color-swatch\" style=\"background: #f5a623;\">\n                            <span class=\"color-copy-hint\">Нажмите, чтобы скопировать<\u002Fspan>\n                        <\u002Fdiv>\n                        <div class=\"color-info\">\n                            <div class=\"color-name\">Оранжевый (внимание)<\u002Fdiv>\n                            <div class=\"color-hex\">#f5a623 · RGB 245, 166, 35<\u002Fdiv>\n                            <div class=\"color-usage\">Предупреждения, прогнозные и плановые значения. Текст на нём — только #232832<\u002Fdiv>\n                        <\u002Fdiv>\n                    <\u002Fdiv>\n                <\u002Fdiv>\n\n                <h3 class=\"palette-subtitle\">Смысловые цвета для текста<\u002Fh3>\n                <p class=\"palette-note\">Затемнённые варианты для цифр и подписей на белом фоне: исходные зелёный, красный и оранжевый не обеспечивают читаемость мелкого текста.<\u002Fp>\n                <div class=\"color-grid\">\n                    <div class=\"color-card\" data-color=\"#2e7d32\" tabindex=\"0\" role=\"button\" aria-label=\"Скопировать цвет #2e7d32\">\n                        <div class=\"color-swatch\" style=\"background: #2e7d32;\">\n                            <span class=\"color-copy-hint\">Нажмите, чтобы скопировать<\u002Fspan>\n                        <\u002Fdiv>\n                        <div class=\"color-info\">\n                            <div class=\"color-name\">Зелёный для текста<\u002Fdiv>\n                            <div class=\"color-hex\">#2e7d32 · RGB 46, 125, 50<\u002Fdiv>\n                            <div class=\"color-usage\">Цифры роста и подписи на белом фоне<\u002Fdiv>\n                        <\u002Fdiv>\n                    <\u002Fdiv>\n                    <div class=\"color-card\" data-color=\"#c62828\" tabindex=\"0\" role=\"button\" aria-label=\"Скопировать цвет #c62828\">\n                        <div class=\"color-swatch\" style=\"background: #c62828;\">\n                            <span class=\"color-copy-hint\">Нажмите, чтобы скопировать<\u002Fspan>\n                        <\u002Fdiv>\n                        <div class=\"color-info\">\n                            <div class=\"color-name\">Красный для текста<\u002Fdiv>\n                            <div class=\"color-hex\">#c62828 · RGB 198, 40, 40<\u002Fdiv>\n                            <div class=\"color-usage\">Цифры снижения и подписи рисков на белом фоне<\u002Fdiv>\n                        <\u002Fdiv>\n                    <\u002Fdiv>\n                    <div class=\"color-card\" data-color=\"#b45309\" tabindex=\"0\" role=\"button\" aria-label=\"Скопировать цвет #b45309\">\n                        <div class=\"color-swatch\" style=\"background: #b45309;\">\n                            <span class=\"color-copy-hint\">Нажмите, чтобы скопировать<\u002Fspan>\n                        <\u002Fdiv>\n                        <div class=\"color-info\">\n                            <div class=\"color-name\">Оранжевый для текста<\u002Fdiv>\n                            <div class=\"color-hex\">#b45309 · RGB 180, 83, 9<\u002Fdiv>\n                            <div class=\"color-usage\">Подписи «прогноз», «план» на белом фоне<\u002Fdiv>\n                        <\u002Fdiv>\n                    <\u002Fdiv>\n                <\u002Fdiv>\n\n                <h3 class=\"palette-subtitle\">Нейтральные цвета и подложки<\u002Fh3>\n                <p class=\"palette-note\">Текст, линии, фоны блоков и таблиц.<\u002Fp>\n                <div class=\"color-grid\">\n                    <div class=\"color-card\" data-color=\"#232832\" tabindex=\"0\" role=\"button\" aria-label=\"Скопировать цвет #232832\">\n                        <div class=\"color-swatch\" style=\"background: #232832;\">\n                            <span class=\"color-copy-hint\">Нажмите, чтобы скопировать<\u002Fspan>\n                        <\u002Fdiv>\n                        <div class=\"color-info\">\n                            <div class=\"color-name\">Графитовый (основной текст)<\u002Fdiv>\n                            <div class=\"color-hex\">#232832 · RGB 35, 40, 50<\u002Fdiv>\n                            <div class=\"color-usage\">Основной текст<\u002Fdiv>\n                        <\u002Fdiv>\n                    <\u002Fdiv>\n                    <div class=\"color-card\" data-color=\"#414b5f\" tabindex=\"0\" role=\"button\" aria-label=\"Скопировать цвет #414b5f\">\n                        <div class=\"color-swatch\" style=\"background: #414b5f;\">\n                            <span class=\"color-copy-hint\">Нажмите, чтобы скопировать<\u002Fspan>\n                        <\u002Fdiv>\n                        <div class=\"color-info\">\n                            <div class=\"color-name\">Серо-синий (вторичный текст)<\u002Fdiv>\n                            <div class=\"color-hex\">#414b5f · RGB 65, 75, 95<\u002Fdiv>\n                            <div class=\"color-usage\">Подписи, источники, номера слайдов<\u002Fdiv>\n                        <\u002Fdiv>\n                    <\u002Fdiv>\n                    <div class=\"color-card\" data-color=\"#c9ced6\" tabindex=\"0\" role=\"button\" aria-label=\"Скопировать цвет #c9ced6\">\n                        <div class=\"color-swatch\" style=\"background: #c9ced6;\">\n                            <span class=\"color-copy-hint\">Нажмите, чтобы скопировать<\u002Fspan>\n                        <\u002Fdiv>\n                        <div class=\"color-info\">\n                            <div class=\"color-name\">Серый (нейтральная серия)<\u002Fdiv>\n                            <div class=\"color-hex\">#c9ced6 · RGB 201, 206, 214<\u002Fdiv>\n                            <div class=\"color-usage\">Категория «прочее» в графиках, неактивные элементы<\u002Fdiv>\n                        <\u002Fdiv>\n                    <\u002Fdiv>\n                    <div class=\"color-card\" data-color=\"#e5e5e5\" tabindex=\"0\" role=\"button\" aria-label=\"Скопировать цвет #e5e5e5\">\n                        <div class=\"color-swatch\" style=\"background: #e5e5e5; border-bottom: 1px solid #e5e5e5;\">\n                            <span class=\"color-copy-hint\">Нажмите, чтобы скопировать<\u002Fspan>\n                        <\u002Fdiv>\n                        <div class=\"color-info\">\n                            <div class=\"color-name\">Светло-серый (линии)<\u002Fdiv>\n                            <div class=\"color-hex\">#e5e5e5 · RGB 229, 229, 229<\u002Fdiv>\n                            <div class=\"color-usage\">Разделители, линии сетки графиков, границы таблиц<\u002Fdiv>\n                        <\u002Fdiv>\n                    <\u002Fdiv>\n                    <div class=\"color-card\" data-color=\"#e8eef8\" tabindex=\"0\" role=\"button\" aria-label=\"Скопировать цвет #e8eef8\">\n                        <div class=\"color-swatch\" style=\"background: #e8eef8; border-bottom: 1px solid #e5e5e5;\">\n                            <span class=\"color-copy-hint\">Нажмите, чтобы скопировать<\u002Fspan>\n                        <\u002Fdiv>\n                        <div class=\"color-info\">\n                            <div class=\"color-name\">Голубая подложка<\u002Fdiv>\n                            <div class=\"color-hex\">#e8eef8 · RGB 232, 238, 248<\u002Fdiv>\n                            <div class=\"color-usage\">Фон карточек, выделенные строки таблиц<\u002Fdiv>\n                        <\u002Fdiv>\n                    <\u002Fdiv>\n                    <div class=\"color-card\" data-color=\"#f8f9fa\" tabindex=\"0\" role=\"button\" aria-label=\"Скопировать цвет #f8f9fa\">\n                        <div class=\"color-swatch\" style=\"background: #f8f9fa; border-bottom: 1px solid #e5e5e5;\">\n                            <span class=\"color-copy-hint\">Нажмите, чтобы скопировать<\u002Fspan>\n                        <\u002Fdiv>\n                        <div class=\"color-info\">\n                            <div class=\"color-name\">Светлая подложка<\u002Fdiv>\n                            <div class=\"color-hex\">#f8f9fa · RGB 248, 249, 250<\u002Fdiv>\n                            <div class=\"color-usage\">Фон блоков, чередующиеся строки таблиц<\u002Fdiv>\n                        <\u002Fdiv>\n                    <\u002Fdiv>\n                <\u002Fdiv>\n\n                <div class=\"table-wrap\">\n                    <h3>Допустимые сочетания текста и фона<\u002Fh3>\n                    <p>Минимальный контраст для текста — 4,5 : 1, для крупного текста от 0,8 M полужирным — 3 : 1 (WCAG 2.1, уровень AA).<\u002Fp>\n                    <table class=\"contrast-table\">\n                        <thead><tr><th>Пример<\u002Fth><th>Сочетание<\u002Fth><th>Контраст<\u002Fth><th>Применение<\u002Fth><\u002Ftr><\u002Fthead>\n                        <tbody>\n                            <tr><td><span class=\"contrast-sample\" style=\"color: #232832; background: #ffffff;\">Аа<\u002Fspan><\u002Ftd><td>Основной текст на белом<br><span style=\"font-family: var(--font-mono); font-size: 12px; color: var(--color-text-secondary);\">#232832 на #ffffff<\u002Fspan><\u002Ftd><td style=\"font-variant-numeric: tabular-nums;\">14,8 : 1<\u002Ftd><td class=\"verdict-ok\">Любой текст<\u002Ftd><\u002Ftr>\n                            <tr><td><span class=\"contrast-sample\" style=\"color: #414b5f; background: #ffffff;\">Аа<\u002Fspan><\u002Ftd><td>Вторичный т ографика -->\n        <section class=\"section\" id=\"typography\" aria-label=\"Типографика\">\n            <div class=\"container\">\n                <div class=\"section-header\">\n                    <div class=\"section-number\">03 · Типографика<\u002Fdiv>\n                    <h2 class=\"section-title\">Шрифты и иерархия<\u002Fh2>\n                    <p class=\"section-description\">\n                        Используется один рубленый шрифт — Golos Text. Иерархия строится размером и начертанием. Кегль задаётся в модулях M и пересчитывается под любой формат.\n                    <\u002Fp>\n                <\u002Fdiv>\n\n                <div class=\"type-showcase\">\n                    <div class=\"type-item\">\n                        <div class=\"type-preview\">\n                            <div style=\"font-size: 42px; font-weight: 700; color: var(--color-primary); letter-spacing: -0.01em; line-height: 1.2;\">Стратегическое видение<\u002Fdiv>\n                        <\u002Fdiv>\n                        <div class=\"type-meta\">\n                            <div class=\"type-meta-item\"><span class=\"type-meta-label\">Уровень:<\u002Fspan> Заголовок титульного слайда<\u002Fdiv>\n                            <div class=\"type-meta-item\"><span class=\"type-meta-label\">Размер:<\u002Fspan> 1,3–1,6 M<\u002Fdiv>\n                            <div class=\"type-meta-item\"><span class=\"type-meta-label\">Начертание:<\u002Fspan> Bold (700)<\u002Fdiv>\n                            <div class=\"type-meta-item\"><span class=\"type-meta-label\">Цвет:<\u002Fspan> #ffffff на синем фоне или #062a5f на белом<\u002Fdiv>\n                            <div class=\"type-meta-item\"><span class=\"type-meta-label\">Регистр:<\u002Fspan> Как в предложении, не более 2 строк<\u002Fdiv>\n                        <\u002Fdiv>\n                    <\u002Fdiv>\n                    <div class=\"type-item\">\n                        <div class=\"type-preview\">\n                            <div style=\"font-size: 28px; font-weight: 600; color: var(--color-secondary); text-transform: uppercase;\">Место центра в управлении НТР<\u002Fdiv>\n                        <\u002Fdiv>\n                        <div class=\"type-meta\">\n                            <div class=\"type-meta-item\"><span class=\"type-meta-label\">Уровень:<\u002Fspan> Заголовок слайда<\u002Fdiv>\n                            <div class=\"type-meta-item\"><span class=\"type-meta-label\">Размер:<\u002Fspan> 0,9–1,1 M<\u002Fdiv>\n                            <div class=\"type-meta-item\"><span class=\"type-meta-label\">Начертание:<\u002Fspan> Semibold (600)<\u002Fdiv>\n                            <div class=\"type-meta-item\"><span class=\"type-meta-label\">Цвет:<\u002Fspan> #144696<\u002Fdiv>\n                            <div class=\"type-meta-item\"><span class=\"type-meta-label\">Регистр:<\u002Fspan> Заглавные, одна строка до 40 знаков; длиннее — как в предложении<\u002Fdiv>\n                        <\u002Fdiv>\n                    <\u002Fdiv>\n                    <div class=\"type-item\">\n                        <div class=\"type-preview\">\n                            <div style=\"font-size: 16px; font-weight: 400; color: var(--color-text); line-height: 1.7; max-width: 700px;\">Федеральное государственное бюджетное учреждение «Центр научно-технологического развития при Правительстве Российской Федерации» создано постановлением Правительства РФ от 14.02.2026 г. № 135.<\u002Fdiv>\n                        <\u002Fdiv>\n                        <div class=\"type-meta\">\n                            <div class=\"type-meta-item\"><span class=\"type-meta-label\">Уровень:<\u002Fspan> Основной текст<\u002Fdiv>\n                            <div class=\"type-meta-item\"><span class=\"type-meta-label\">Размер:<\u002Fspan> 0,55–0,6 M<\u002Fdiv>\n                            <div class=\"type-meta-item\"><span class=\"type-meta-label\">Начертание:<\u002Fspan> Regular (400)<\u002Fdiv>\n
